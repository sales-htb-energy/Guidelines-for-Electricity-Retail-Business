<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電力の小売営業に関する指針 理解度テスト</title>
<style>
:root{
  --paper:#eceff2;
  --surface:#ffffff;
  --ink:#16222e;
  --ink-soft:#55677a;
  --line:#d3dae1;
  --brand:#12496b;
  --ok:#1b7a4b;
  --ok-bg:#eaf5ee;
  --ng:#b23b2e;
  --ng-bg:#fbeceb;
  --cite:#7a5a16;
  --cite-bg:#f6efdc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}

/* ---- header ---- */
header{
  background:var(--brand);
  color:#fff;
  border-bottom:3px solid var(--cite);
}
header .wrap{padding-top:26px;padding-bottom:24px}
h1{font-size:24px;line-height:1.4;margin:0 0 6px;letter-spacing:.01em;font-weight:700}
header p{margin:0;font-size:13.5px;color:#c3d6e4}

/* ---- panels ---- */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  padding:24px;
  margin-top:22px;
}
.panel h2{font-size:16px;margin:0 0 4px;font-weight:700}
.panel .note{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:0;margin-bottom:10px}

.chapters{display:grid;gap:2px}
.chapters label{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 12px;border-radius:4px;cursor:pointer;
  border:1px solid transparent;
}
.chapters label:hover{background:#f4f7f9}
.chapters input{margin:0;position:relative;top:2px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.ch-name{flex:1;font-size:14.5px}
.ch-meta{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-actions{display:flex;gap:16px;margin:8px 0 0 12px}
.linkish{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{color:var(--cite)}

.row{display:flex;flex-wrap:wrap;gap:22px}
.field{flex:1 1 200px}
.field span{display:block;font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
select{
  width:100%;padding:10px 12px;font:inherit;font-size:15px;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);
}
button{font-family:inherit}
.btn{
  display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:4px;
  padding:13px 30px;font-size:15.5px;font-weight:700;cursor:pointer;line-height:1.4;
}
.btn:hover{background:#0e3a56}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.ghost:hover{background:#eef4f8}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}

/* ---- quiz ---- */
.status{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:22px;font-size:13.5px;color:var(--ink-soft);
}
.count{font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-size:19px;font-weight:700}
.bar{height:4px;background:#dde3e9;border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s ease}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{font-size:12px;padding:3px 9px;border-radius:3px;background:#eef2f5;color:var(--ink-soft)}
.tag.cite{background:var(--cite-bg);color:var(--cite);font-variant-numeric:tabular-nums}
.qtext{font-size:17.5px;line-height:1.7;font-weight:700;margin:0 0 20px}

.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:5px;
  padding:14px 16px;font-size:15px;line-height:1.65;color:var(--ink);cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--brand);background:#f6f9fb}
.opt:disabled{cursor:default}
.opt .k{
  flex:none;width:22px;height:22px;border-radius:3px;background:#eef2f5;color:var(--ink-soft);
  font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;
}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
.opt.wrong .k{background:var(--ng);color:#fff}
.opt.dim{opacity:.55}

.verdict{margin-top:20px;border-left:3px solid var(--line);padding:2px 0 2px 16px}
.verdict.ok{border-color:var(--ok)}
.verdict.ng{border-color:var(--ng)}
.verdict h3{margin:0 0 6px;font-size:15px}
.verdict.ok h3{color:var(--ok)}
.verdict.ng h3{color:var(--ng)}
.verdict p{margin:0;font-size:14.5px;line-height:1.8}
.verdict .src{display:inline-block;margin-top:10px;font-size:12.5px;background:var(--cite-bg);color:var(--cite);padding:3px 9px;border-radius:3px;font-variant-numeric:tabular-nums}
.hintline{font-size:12.5px;color:var(--ink-soft);margin-top:18px}
kbd{font-family:inherit;background:#eef2f5;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:11.5px}

/* ---- result ---- */
.score{display:flex;align-items:baseline;gap:12px;margin:0 0 4px}
.score .num{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .den{font-size:17px;color:var(--ink-soft)}
.score .pct{margin-left:auto;font-size:17px;font-variant-numeric:tabular-nums}
.judge{font-size:14.5px;color:var(--ink-soft);margin:10px 0 22px}
.bychap{border-top:1px solid var(--line)}
.bychap div{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.bychap .n{flex:1}
.bychap .s{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.bychap .g{width:88px;height:6px;background:#e4e9ee;border-radius:3px;overflow:hidden;flex:none}
.bychap .g i{display:block;height:100%;background:var(--brand)}
.review{margin-top:10px}
.review details{border-bottom:1px solid var(--line);padding:12px 0}
.review summary{cursor:pointer;font-size:14.5px;font-weight:700;line-height:1.6}
.review summary::marker{color:var(--ng)}
.review .body{padding:12px 0 4px;font-size:14px;line-height:1.8}
.review .ans{margin:0 0 8px}
.review .ans b{color:var(--ok)}
.review .yours{color:var(--ng)}
footer{font-size:12px;color:var(--ink-soft);text-align:center;padding:28px 20px 0}
.hidden{display:none}
@media (max-width:560px){
  h1{font-size:20px}
  .panel{padding:18px}
  .qtext{font-size:16.5px}
  .btn{width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--cite);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>電力の小売営業に関する指針　理解度テスト</h1>
    <p>令和8年4月9日最終改定版に対応　全<span id="totalq">0</span>問／解説に指針の該当ページを表示</p>
  </div>
</header>

<div class="wrap">

  <!-- 設定 -->
  <section class="panel" id="setup">
    <h2>出題範囲を選ぶ</h2>
    <p class="note">章を選び、出題数と順序を決めて開始します。解答するとその場で正誤と解説が表示されます。</p>

    <fieldset>
      <legend>章</legend>
      <div class="chapters" id="chapters"></div>
      <div class="mini-actions">
        <button type="button" class="linkish" id="selAll">すべて選ぶ</button>
        <button type="button" class="linkish" id="selNone">すべて外す</button>
      </div>
    </fieldset>

    <div class="row">
      <label class="field"><span>出題数</span>
        <select id="numq">
          <option value="10">10問</option>
          <option value="20" selected>20問</option>
          <option value="30">30問</option>
          <option value="50">50問</option>
          <option value="0">選んだ章のすべて</option>
        </select>
      </label>
      <label class="field"><span>出題順</span>
        <select id="order">
          <option value="random" selected>ランダム</option>
          <option value="seq">指針の掲載順</option>
        </select>
      </label>
    </div>

    <p class="note" id="poolinfo"></p>
    <div class="actions"><button class="btn" id="start">テストを開始</button></div>
  </section>

  <!-- 出題 -->
  <section id="quiz" class="hidden">
    <div class="status">
      <span class="count"><b id="qnum">1</b> / <span id="qtotal">20</span>問</span>
      <span class="count">正答 <b id="hit">0</b></span>
    </div>
    <div class="bar"><i id="prog" style="width:0%"></i></div>

    <div class="panel">
      <div class="tags"><span class="tag" id="tagchap"></span><span class="tag cite" id="tagpage"></span></div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div id="verdict"></div>
      <div class="actions" id="qactions"></div>
      <p class="hintline"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> で解答、<kbd>Enter</kbd> で次へ進めます。</p>
    </div>
    <div class="actions"><button class="btn ghost" id="quit">中断して設定に戻る</button></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <div class="panel">
      <h2>結果</h2>
      <div class="score"><span class="num" id="rnum">0</span><span class="den">/ <span id="rden">0</span>問正解</span><span class="pct" id="rpct"></span></div>
      <p class="judge" id="rjudge"></p>
      <div class="bychap" id="bychap"></div>
      <div class="actions" style="margin-top:22px">
        <button class="btn" id="retryWrong">間違えた問題だけ解き直す</button>
        <button class="btn ghost" id="again">設定に戻る</button>
      </div>
    </div>
    <div class="panel review" id="reviewPanel">
      <h2>間違えた問題の復習</h2>
      <p class="note">見出しをクリックすると正解と解説が開きます。</p>
      <div id="review"></div>
    </div>
  </section>

  <footer>出典：経済産業省「電力の小売営業に関する指針」（平成28年1月制定／令和8年4月9日最終改定）。解説中のページ番号は同指針本文のページです。</footer>
</div>

<script>
const DATA = {"chapters":[{"id":1,"name":"序・用語の定義","range":"p.1〜3"},{"id":2,"name":"一般的な情報提供","range":"p.4〜8"},{"id":3,"name":"説明義務・書面交付（本編）","range":"p.8〜15"},{"id":4,"name":"電源構成・非化石証書の開示","range":"p.16〜35"},{"id":5,"name":"営業・契約形態の適正化","range":"p.36〜45"},{"id":6,"name":"契約内容の適正化","range":"p.46〜47"},{"id":7,"name":"苦情・問合せ／停電対応","range":"p.48〜49"},{"id":8,"name":"解除等手続・休廃止","range":"p.50〜57"},{"id":9,"name":"参考：説明義務・書面交付の解説","range":"p.58〜69"},{"id":10,"name":"料金高騰リスク対応の参考事例","range":"p.70〜73"}],"questions":[{"c":1,"p":"p.2","q":"本指針を遵守すべき主たる関係事業者として正しいものはどれか。","o":["小売電気事業者及びその需要バランシンググループ","小売電気事業者及びその媒介・取次・代理業者","小売電気事業者及び発電事業者・卸供給事業者","小売電気事業者及び一般送配電事業者・配電事業者"],"a":1,"e":"主たる関係事業者は小売電気事業者及びその媒介・取次・代理業者。なお4（2）及び5には一般送配電事業者・配電事業者が遵守すべきルールも記載されている。"},{"c":1,"p":"p.2","q":"登録特定送配電事業者及びその媒介・取次・代理業者の本指針上の扱いはどれか。","o":["本指針の適用対象外である","経過措置期間中のみ適用される","記載はないが同様に遵守が求められる","低圧供給についてのみ適用される"],"a":2,"e":"本指針には記載されていないが、その小売供給及び契約締結の媒介等に関しては本指針を同様に遵守することが求められる。"},{"c":1,"p":"p.3","q":"本指針の「解除等」に含まれないものはどれか。","o":["契約内容の軽微な変更","契約の解除","契約の解約","契約の更新を行わないこと"],"a":0,"e":"「解除等」は契約の解除若しくは解約すること又は更新を行わないことをいう。更新拒否が含まれる点に注意。"},{"c":1,"p":"p.2 脚注3","q":"小売供給契約の解約に伴い発生する電気用品のリース契約の精算金は、本指針の「違約金等」に含まれるか。","o":["含まれる","含まれない","低圧契約の場合のみ含まれる","事業者が約款で定めた場合のみ含まれる"],"a":0,"e":"別個の契約に係る違約金・精算金その他の需要家の負担となるものがある場合には、当該負担を含むとされている。"},{"c":1,"p":"p.3","q":"本指針の「電源構成」の定義として正しいものはどれか。","o":["保有する発電設備の設備容量に係る電源種の構成","発電・調達する電気の電力量に係る電源種の構成","供給区域内の全発電所の発電実績に係る構成","使用した非化石証書の量に係る電源種の構成"],"a":1,"e":"電源構成は電力量ベースの電源種の構成をいう。非化石電源比率は電源構成ではなく非化石証書の使用量に基づき定まる（p.18）。"},{"c":1,"p":"p.3","q":"本指針の「スイッチング」の定義として正しいものはどれか。","o":["小売電気事業者の料金メニューを他のメニューに変えること","小売供給契約の契約名義人を他の者に変更すること","小売供給を受ける需要場所を他の場所に変更すること","小売電気事業者を他の小売電気事業者に切り替えること"],"a":3,"e":"スイッチングは、需要家が自らに対して小売供給を行う小売電気事業者を他の小売電気事業者に切り替えることをいう。"},{"c":1,"p":"p.38","q":"「取次ぎ」の定義として正しいものはどれか。","o":["自己の名をもって自己の計算において行う","他人の間に立って成立に尽力する","自己の名をもって他人の計算において行う","他人の名をもって他人のために行う"],"a":2,"e":"取次ぎ＝自己の名をもって、他人（小売電気事業者）の計算において法律行為をすることを引き受ける行為。"},{"c":1,"p":"p.38","q":"「媒介」の定義として正しいものはどれか。","o":["他人の名をもって当該他人のために行う意思表示","他人の間に立って契約の成立に尽力する事実行為","自己の名をもって小売供給契約を自ら締結する行為","自己の名をもって他人の計算において引き受ける行為"],"a":1,"e":"媒介＝他人（小売電気事業者及び小売供給を受けようとする者）の間に立ち、当該他人を当事者とする契約の成立に尽力する事実行為。"},{"c":1,"p":"p.2","q":"業務改善勧告を行う主体はどれか。","o":["経済産業大臣","資源エネルギー庁長官","公正取引委員会","電力・ガス取引監視等委員会"],"a":3,"e":"業務改善勧告は電気事業法第66条の12第1項に基づく電力・ガス取引監視等委員会の勧告。業務改善命令は経済産業大臣が行う。"},{"c":1,"p":"p.1","q":"低圧部門を含めて電気の小売業への参入が全面自由化された日はどれか。","o":["平成28年4月1日","平成28年1月1日","平成27年12月1日","平成26年4月1日"],"a":0,"e":"平成28年4月1日に第2弾の改正電気事業法が施行され、小売全面自由化が実現した。本指針の制定は平成28年1月。"},{"c":2,"p":"p.4","q":"次のうち、指針上「問題となる行為」はどれか。","o":["二酸化炭素排出係数を電源構成に併記しないこと","低圧需要家向けの標準メニューを公表しないこと","平均的な電力使用量の月額料金例を公表しないこと","料金請求の根拠となる使用電力量等を示さないこと"],"a":3,"e":"料金請求の根拠を請求書記載やウェブ閲覧等の方法で示さないことは問題となる。他の3つはいずれも「望ましい行為」を行わないにとどまる。"},{"c":2,"p":"p.4","q":"需要家の誤解を招く情報提供として指針が例示している表現はどれか。","o":["当社は地球温暖化対策に積極的です","当社は業界最安値水準を目指します","当社は24時間受付体制です","当社の電気は停電しにくい"],"a":3,"e":"「当社の電気は停電しにくい」など誤解を招く情報提供で自己のサービスに誘導することは問題となる。"},{"c":2,"p":"p.4","q":"取次業者が料金請求の根拠を示さなかった場合の小売電気事業者の責任はどれか。","o":["指導・監督が適切でなければ自身の行為が問題となる","契約上の責任は取次業者のみが負い問題とならない","委託契約で責任範囲を定めていれば問題とならない","需要家からの申出後に是正すれば問題とならない"],"a":0,"e":"媒介・取次・代理業者が問題となる行為をしたときでも、小売電気事業者の指導・監督が適切でない場合は小売電気事業者自身の行為が問題となる。"},{"c":2,"p":"p.5","q":"標準メニューの数について、指針の記述として正しいものはどれか。","o":["各小売電気事業者につき1つに限られる","年度ごとに1つに限られる","各小売電気事業者に1つと限られない","低圧・高圧で各1つに限られる"],"a":2,"e":"需要形態等に応じ様々なメニューが設定されるため、標準メニューは各社1つに限られない。"},{"c":2,"p":"p.5","q":"標準メニューを公表した場合に、公表メニュー以外の供給条件による販売を行うことは認められるか。","o":["期間限定の割引料金の適用など許容される","公表メニュー以外の販売は一切認められない","高圧需要家に対する場合に限り認められる","事前に届出を行った場合に限り認められる"],"a":0,"e":"標準メニューを公表した場合でも、期間限定の割引料金を適用するなど公表メニュー以外の供給条件による販売も許容される。"},{"c":2,"p":"p.5","q":"平均的な月額料金例の公表について、指針が望ましいとしている対象需要家はどれか。","o":["高圧需要家","特別高圧需要家","低圧需要家","全ての需要家"],"a":2,"e":"低圧需要家向けに平均的な電力使用量における月額料金例を公表することが望ましいとされる。"},{"c":2,"p":"p.5","q":"自らの広告媒体である価格比較サイトで、誤解を招く情報を把握しながら長期間不当に放置した場合の評価はどれか。","o":["訂正の要請をすれば問題とならない","望ましくないにとどまる","問題となる","第三者の行為なので問題とならない"],"a":2,"e":"訂正の働きかけは本来「望ましい行為」だが、自らの広告媒体で把握しながら長期間不当に放置し働きかけを行わない場合は問題となる。"},{"c":2,"p":"p.5","q":"電気料金に工事費等が含まれている場合、請求書等に工事費等の相当額を記載することの位置づけはどれか。","o":["問題となる行為","望ましい行為","法令上の義務","記載してはならない事項"],"a":1,"e":"電気料金の透明性確保の観点から、請求書・領収書等に工事費等の相当額を記載することが望ましいとされる。"},{"c":2,"p":"p.6","q":"配電事業者の託送料金が一般送配電事業者と異なる場合の請求書等への記載方法として、指針が例示するものはどれか。","o":["需要家の求めがある場合にのみ内訳を記載する","一般送配電と配電事業者の託送料金の平均額を記載する","当該配電事業者の託送料金相当額のみを記載する","一般送配電の相当額を記載し注釈でURL等を示す"],"a":3,"e":"一般送配電事業者の託送料金相当額を記載したうえで、注釈等により配電事業者の供給区域や託送料金単価が分かるウェブサイトのアドレス等を記載する方法が例示されている。"},{"c":2,"p":"p.6","q":"業務改善命令を受けた事実を公表することが望ましいとされている主体はどれか。","o":["一般送配電事業者","当該小売電気事業者自身","経済産業省のみ","電力・ガス取引監視等委員会のみ"],"a":1,"e":"需要家が事実を把握できるようにすることが需要家保護の観点から適当であるため、小売電気事業者自身の公表が望ましい。"},{"c":2,"p":"p.6","q":"市場連動型料金メニューの情報提供をホームページで行う場合に望ましい形はどれか。","o":["PDFのみで掲載する","会員専用ページ内に掲載する","トップ画面から3クリック以内でアクセスできる","トップ画面からワンクリックでアクセスできる"],"a":3,"e":"トップ画面から情報提供ページにワンクリックでアクセスできるようにすることが望ましい。市場価格高騰時にはより積極的な情報提供も望ましい。"},{"c":2,"p":"p.6〜7","q":"燃料費調整等の情報提供について、ワンクリックに加えて望ましいとされる条件はどれか。","o":["トップ画面に調整単価を示すバナーを常時掲出していること","他の料金メニューと比較してたどりつきやすさに遜色がないこと","燃料費調整単価の推移を毎日更新して掲載し続けていること","情報提供ページを1年以上継続して掲載し続けていること"],"a":1,"e":"他の料金メニューと比較してたどりつきやすさに遜色がなく、料金が比較しやすいようになっていることが望ましい。"},{"c":2,"p":"p.7","q":"調整上限の算定方法や更新の条件等の考え方を定めることが望ましいとされている場所はどれか。","o":["請求書","供給約款等","社内規程","契約締結後交付書面のみ"],"a":1,"e":"調整上限の算定方法（基準価格を含む）や更新条件等の考え方を供給約款等に定め、あわせてホームページ等で分かりやすく情報提供することが望ましい。"},{"c":2,"p":"p.7","q":"需要家から要望があった場合に、合理的な範囲で提供することが望ましいとされる情報はどれか。","o":["株主の構成及び上位株主それぞれの持株比率","主要な取引先金融機関の名称及び借入金の残高","代表者及び役員の氏名並びに就任時の経歴","リスクヘッジ割合等の調達コスト変動への対応方針"],"a":3,"e":"価格変動がある電源の調達コスト変動への対応方針・取組（リスクヘッジ割合等の定量的情報を含む）や、所属する需要バランシンググループに関する情報の提供が望ましい。"},{"c":2,"p":"p.7","q":"需要バランシンググループに関する情報として、指針が例示しているものはどれか。","o":["グループを構成する各事業者の販売電力量","代表契約者の資本金の額及び設立年月日","グループの契約期間及び更新の予定時期","需給管理の実施者やインバランス料金の負担者"],"a":3,"e":"需給管理の実施者、インバランス料金の負担者等の情報が例示されている。"},{"c":2,"p":"p.8","q":"障害のある者への情報提供に当たり、参考にすることが適切とされている指針はどれか。","o":["経済産業省対応指針","電気設備技術基準の解釈","消費者基本計画","日本産業規格Z8305"],"a":0,"e":"障害者差別解消法に基づく「経済産業省所管事業分野における障害を理由とする差別の解消の推進に関する対応指針」（令和5年経産省告示第168号）を参考にすることが適切とされる。"},{"c":3,"p":"p.8","q":"供給条件の説明義務の根拠条文はどれか。","o":["電気事業法第2条の15","電気事業法第2条の13第1項","電気事業法第2条の12第1項","電気事業法第2条の14第1項"],"a":1,"e":"説明義務は法第2条の13第1項。契約締結前交付書面は同条第2項・第3項、契約締結後交付書面は法第2条の14による。"},{"c":3,"p":"p.8","q":"契約締結後交付書面の交付義務の根拠条文はどれか。","o":["電気事業法第2条の14","電気事業法第2条の17","電気事業法第2条の13第2項","電気事業法第2条の15"],"a":0,"e":"契約締結後交付書面は法第2条の14に基づき、遅滞なく交付しなければならない。"},{"c":3,"p":"p.9","q":"契約締結前交付書面に用いる文字及び数字の大きさの原則はどれか。","o":["定めはない","8ポイント以上","10ポイント以上","12ポイント以上"],"a":1,"e":"施行規則第3条の12第13項により、JIS Z8305に規定する8ポイント以上の大きさの文字及び数字を用いる。"},{"c":3,"p":"p.9","q":"契約締結前交付書面において、特に重要な事項に求められる記載方法はどれか。","o":["枠の中に10ポイント以上で記載する","赤字かつ下線を付して記載する","冒頭にまとめて記載する","枠の中に12ポイント以上で記載する"],"a":3,"e":"需要家の判断に影響を及ぼす特に重要な事項は、枠の中に12ポイント以上の文字・数字で明瞭かつ正確に記載しなければならない。"},{"c":3,"p":"p.63〜64","q":"契約締結前交付書面の「特に重要な事項」の例として、指針が挙げていないものはどれか。","o":["小売供給に係る料金","解除等に伴う違約金等","小売供給開始の予定年月日","料金が変動する旨"],"a":2,"e":"特に重要な事項の例は、料金（算出方法を含む）、料金が変動する旨（上限がある場合はその旨）、解除等に伴う違約金等。"},{"c":3,"p":"p.8〜9","q":"施行規則第3条の12第6項が定める説明の方法及び程度の基準はどれか。","o":["全ての需要家に対し一律の方法及び程度による","書面又は電磁的方法による説明を原則とする","30分以上の説明時間を確保することを要する","需要家の知識、経験及び契約の目的に照らす"],"a":3,"e":"需要家の知識、経験及び小売供給契約を締結する目的に照らして、需要家に理解されるために必要な方法及び程度によらなければならない。"},{"c":3,"p":"p.9","q":"セット販売において明示する必要があるものはどれか。","o":["他の商品・役務の原価","電気料金の額の算出方法","セット割引等の電気料金への配分金額","割引の原資"],"a":1,"e":"電気料金の額の算出方法は明示が必要。一方、セット割引等の電気料金への配分金額を明示する必要まではない。"},{"c":3,"p":"p.9 脚注9","q":"セット販売を行う場合の電力取引報における売上高の報告方法はどれか。","o":["電気料金の売上高は報告の対象とはならない","割引額を振り分けた上で電気料金の売上高を報告する","割引額を全額他の商品・役務側に計上して報告する","セット割引後の合計額をそのまま売上高として報告する"],"a":1,"e":"電気料金とそれ以外の商品・役務提供の対価に割引額を振り分けた上で、電気料金の売上高を報告する必要がある。"},{"c":3,"p":"p.10","q":"セット販売で商品ごとに契約先が異なる場合に求められる対応はどれか。","o":["書面にのみ記載すること","特段の対応は不要であること","需要家から質問があれば説明すること","その旨を適切に説明すること"],"a":3,"e":"契約先が異なるときはその旨を適切に説明し、契約締結前・締結後交付書面にも記載することが求められる。"},{"c":3,"p":"p.10","q":"キャッシュバック等を行う場合に明示すべき事項はどれか。","o":["キャッシュバックに係る課税関係の取扱い","キャッシュバックの申込件数及び実績金額","キャッシュバックの原資及びその費用の内訳","誰が責任を持ってどのような手続で行うのか"],"a":3,"e":"キャッシュバックを行う責任主体が曖昧であるという問題が生じる懸念があるため、責任主体と手続の明示が求められる。"},{"c":3,"p":"p.11","q":"市場連動型料金メニューについて、メリットのみを告げデメリットを告げない行為の評価はどれか。","o":["説明義務に違反する","問題とならない","望ましくないにとどまる","低圧契約の場合のみ違反となる"],"a":0,"e":"需要家の誤認に基づく選択を招くものであり、需要家保護を趣旨とする説明義務に違反する。上限設定があるメニューを明示的に希望されたのに説明しない場合も同様。"},{"c":3,"p":"p.11","q":"施行規則第3条の12第1項第8号により、料金が変動する場合に説明すべき事項の組合せはどれか。","o":["変動額の算出方法・上限の有無・解約条件","変動する旨・過去の変動実績・上限の有無","変動する旨・変動額の算出方法・上限の有無","変動する旨・適用単価・支払方法"],"a":2,"e":"燃料や電力の取引価格の変動により料金が変動する場合は、その旨並びに変動の額の算出方法及び上限の有無を説明しなければならない。"},{"c":3,"p":"p.11","q":"需要家の属性の把握について、特段の措置を講ずる必要がないとされる場合はどれか。","o":["需要家が能動的に申し込む場合","高齢者と小売供給契約を締結する場合","訪問販売により契約を締結する場合","低圧の小売供給契約を締結する場合"],"a":0,"e":"郵便、電話、ホームページなどを通じて需要家が能動的に申し込む契約については、特段の事情のない限り属性の把握・判断について特段の措置を要しない。"},{"c":3,"p":"p.11","q":"高齢者や十分な判断能力を欠く懸念がある需要家への説明について、望ましいとされる対応はどれか。","o":["専用資料を用意し必要な説明を行ったことを確認する","書面の交付をもって口頭による説明に代える","説明事項を要点のみに簡略化して短時間で伝える","家族等の同席を必須として本人への説明を省く"],"a":0,"e":"専用の資料を用意するなどした上で理解の程度に応じてより丁寧かつ詳細な説明を行い、必要な説明を行ったことを確認することが望ましい。"},{"c":3,"p":"p.11〜12","q":"需要家が新たな入居先で電気の使用を開始した後に申し込んだ場合、望まれる対応はどれか。","o":["効力を遡らせることはできない","翌月1日から契約の効力を生じさせる","使用を開始した日まで契約の効力を遡らせる","申込日から契約の効力を生じさせる"],"a":2,"e":"無契約状態とならないよう、電気の使用を開始した日まで小売供給契約の効力を遡らせることが望まれる。"},{"c":3,"p":"p.12","q":"需要家が無契約状態で電気を使用している事実を知りつつ、使用開始日を偽ることを助長する行為の評価はどれか。","o":["届出を行えば許容される","需要家の利益になるため許容される","問題となる","望ましくないにとどまる"],"a":2,"e":"電気事業の健全な発達に支障が生じるおそれがあることから問題となる。媒介・取次・代理業者の行為でも指導・監督が適切でなければ小売電気事業者自身の行為が問題となる。"},{"c":3,"p":"p.12","q":"無契約状態での電気の使用を解消するために需要家が選択する必要がある二者はどれか。","o":["最終保障供給を受けるか特定小売供給を受けるか","無契約期間の違約金を支払うか契約を遡らせるか","新規に契約を締結するか供給停止を受け入れるか","契約の効力を遡らせるか最終保障供給を受けたとするか"],"a":3,"e":"無契約状態での使用開始日から契約締結日までの期間について、自己との契約の効力を遡らせるか、最終保障供給（経過措置期間中の低圧は特定小売供給）を受けたとするかの選択が必要となる。"},{"c":3,"p":"p.13","q":"オール電化等により他のエネルギーから電力へ切り替える場合、切替え先事業者が説明することが望ましい事項はどれか。","o":["切替え工事の日程が既に確定しているという旨","切替え後に保安点検を毎年実施するという旨","一定期間前に解除等を通知する必要が生じる可能性","既存設備の撤去費用を需要家が全額負担する旨"],"a":2,"e":"切替え前の事業者との他のエネルギー供給契約の解除等の条件によっては、一定期間前に解除等を通知する必要が生じる可能性がある旨の説明が望ましい。"},{"c":4,"p":"p.18","q":"電源構成等を開示する場合（小売供給の特性とする場合を除く）の算定期間として望ましいものはどれか。","o":["前年度実績値又は当年度計画値","直近12か月の移動平均値","当年度の月別実績値","過去3年度の平均値"],"a":0,"e":"前年度実績値（確定前は前々年度実績値）又は当年度計画値として算定することが望ましい。"},{"c":4,"p":"p.18","q":"実績値がない新規参入の小売電気事業者による電源構成の開示方法はどれか。","o":["同一エリアの業界平均値を用いて開示する","前年度実績値が確定するまでは開示ができない","一般送配電事業者が公表する値を用いて開示する","供給開始後数ヶ月間の直近実績値による開示もあり得る"],"a":3,"e":"実績値がない新規参入事業者の場合、供給開始後数ヶ月間の直近実績値をもって開示することもあり得るとされている。"},{"c":4,"p":"p.18","q":"ある年度（4月〜翌年3月）に供給する電気に対応する非化石証書の発電期間はどれか。","o":["前年1月から12月までの発電分","前年4月から当年3月までの発電分","当年4月から翌年3月までの発電分","当年1月から12月までの発電分"],"a":3,"e":"非化石電源比率及び排出係数の算定スケジュールの関係から、供給年度に対しては当年1月〜12月発電分の非化石証書が対応する。"},{"c":4,"p":"p.20","q":"前年度調達実績が合計10,000kWh（水力1,000／石炭火力2,000／LNG火力2,200／原子力1,000／FIT風力100／太陽光500／卸電力取引所1,300／その他1,900）、水力20%以上メニューの前年度販売実績が2,000kWh（うち水力25%）の場合、控除後の石炭火力の割合はどれか。","o":["約25.0%","約20.8%","約20.0%","約18.8%"],"a":1,"e":"水力は2,000×25%＝500kWh。残り1,500kWhを20:22:10:1:5:13:19（計90）で按分すると石炭は約333kWh。（2,000−333)÷(10,000−2,000)≒20.8%。"},{"c":4,"p":"p.31","q":"FIT電気を含む電源構成を表示する場合の3要件に含まれないものはどれか。","o":["電源構成全体又は特定メニューに占める割合を説明すること","FIT制度の説明をすること","発電所の立地地域を表示すること","「FIT電気」である点を誤解を招かない形で説明すること"],"a":2,"e":"3要件は（ア）「FIT電気」である点の説明、（イ）割合の説明、（ウ）FIT制度の説明。立地地域の説明は「〇〇地域産電力」等を訴求する場合の要件。"},{"c":4,"p":"p.31","q":"FIT電気を文字で表示・説明する場合に求められる表記はどれか。","o":["片仮名で「フィット」と表示する","「再エネ買取電気」と表示する","アルファベットで「FIT」と表示する","「固定価格買取電気」と表示する"],"a":2,"e":"需要家の混乱回避の観点からアルファベットの「FIT」が求められ、片仮名の「フィット」に割合やFIT制度の説明を付記する場合も問題となる。"},{"c":4,"p":"p.23","q":"非化石証書を使用せずに水力発電による電気として表示する場合に必要な注釈はどれか。","o":["再生可能エネルギー電源としての価値がない旨の注釈のみ","CO2ゼロエミッション価値がない旨の注釈のみ","全国平均のCO2排出量を下回る旨の注釈のみ","再エネとしての価値とCO2ゼロエミ価値の双方がない旨"],"a":3,"e":"再エネ電源の電源種を表示しながら非化石証書の使用がない場合は、双方の注釈が必要。再エネ指定でない証書を使用する場合は再エネとしての価値がない旨の注釈が必要。"},{"c":4,"p":"p.24","q":"非化石証書を使用した場合、その小売電気事業者の電源構成に与える影響はどれか。","o":["電源構成の開示義務が免除される","使用量が「その他」に計上される","電源構成には影響しない","使用量に応じて再エネ電源に計上される"],"a":2,"e":"非化石価値は電源構成そのものとは異なるため、証書を使用しても電源構成には影響しない。証書使用を理由に「再生可能エネルギー電気100%」と表示することは問題となる。"},{"c":4,"p":"p.24","q":"「再エネ指定の非化石証書の使用により実質的に再エネ●●％の調達を実現している」と訴求する場合の条件はどれか。","o":["注釈を資料の巻末にまとめて分かりやすく記載する","非化石証書の購入枚数と購入先を併せて表示する","電源構成の表示を省略し再エネ比率のみを表示する","近接箇所に電源構成を表示し証書使用の意味を説明する"],"a":3,"e":"当該訴求と近接した箇所に電源構成の表示又は主な電源種の表示を分かりやすく行い、かつ非化石証書の使用によるという意味であることを明確に説明している限り問題とならない。"},{"c":4,"p":"p.25 脚注24","q":"次のうち、指針上「問題となる行為には当たらない」とされている説明はどれか。","o":["クリーンな電源で発電しているためきれいな電気が届く","安定的な電源のため周波数や電圧が安定している","当社の電源構成により電気の品質が優れている","当社はクリーンな電源で発電し温暖化対策に取り組んでいる"],"a":3,"e":"送配電網を経由する電気は物理的に混ざるため、電源構成が供給される電気の質と同様であるかのような説明は問題となる。ただし選択肢の1つ目は問題となる行為には当たらない。"},{"c":4,"p":"p.21","q":"「地産地消」と訴求するために最低限満たす必要がある要件はどれか。","o":["再生可能エネルギー電源のみを用いて供給を行うこと","特定の地域に本社又は事業所を置く事業者が販売すること","特定の地域の地方自治体と協定を締結して販売すること","特定地域の発電所の電気を同一地域の需要家へ販売すること"],"a":3,"e":"「地産地消」は発電場所と供給場所の地域的同一性を前提とする概念であり、この要件を満たす必要がある。関東地方など広い地域を特定して訴求することは望ましくない。"},{"c":4,"p":"p.21","q":"「〇〇地域産電力」と訴求する場合に最低限説明が必要な事項はどれか。","o":["発電所の立地地域","発電所の立地場所及び電気の供給地域","発電所の設備容量及び稼働率","燃料の調達先及び輸送経路"],"a":0,"e":"「〇〇地域産電力」は発電所の立地地域、「地産地消」は発電所の立地場所及び電気の供給地域の説明が最低限必要（施行規則第3条の12第1項第24号）。"},{"c":4,"p":"p.28","q":"常時バックアップにより調達した電気の電源構成の仕分け方法はどれか。","o":["調達先との契約で定めた任意の比率により仕分ける","電力調査統計の旧一般電気事業者の発電実績に基づき仕分ける","実際の電源にかかわらず一律に「その他」に区分する","実際の電源にかかわらず一律に「卸電力取引所」に区分する"],"a":1,"e":"資源エネルギー庁が集計する電力調査統計で公表される旧一般電気事業者の発電部門の電源種別発電実績（当該事業者が公表している場合はその数値）に基づき仕分ける必要がある。"},{"c":4,"p":"p.28〜29","q":"日本卸電力取引所から調達した電気の二酸化炭素排出係数の算出方法はどれか。","o":["約定事業者の基礎排出係数を約定電力量で加重平均する","電源が特定できないためゼロとして取り扱う","自社の前年度の調整後排出係数をそのまま用いる","供給区域の全国平均の排出係数をそのまま用いる"],"a":0,"e":"この方法以外で算出することは問題となる。あわせて「卸電力取引所」区分にどのような電気が含まれ得るのかの明示も必要。"},{"c":4,"p":"p.29","q":"蓄電設備に蓄電し放電した電気について、電力量が移転したとして算定することの評価はどれか。","o":["特定メニューの場合のみ問題となる","計画値による算定の場合のみ問題となる","実際に充放電が行われているため問題はない","時点間移転として問題となる"],"a":2,"e":"昼間発電分を夜間供給分とみなすような時点間移転は問題となるが、蓄電設備による充放電は実際に電気の移転が行われているため問題ない。"},{"c":4,"p":"p.30","q":"特定メニューの販売電力量を控除せずに電源構成を開示する場合に必要な対応はどれか。","o":["控除前の数値であるため開示自体を控えること","特定メニューの需要家にのみ内訳を通知すること","特定メニュー分を含む旨の適切な注釈を付すこと","全販売電力量のみを併記し注釈は付さないこと"],"a":2,"e":"控除せずに算定した電源構成を開示する場合は、特定メニューによる販売電力量や非化石証書使用量を含んだ情報である旨の注釈が必要であり、付さないことは問題となる。"},{"c":5,"p":"p.36","q":"受電実態がない者が需要家に代わり自らの名義で小売供給契約を締結する行為の評価はどれか。","o":["届出を行えば許容される","原則として電気事業法上問題となる","需要家の同意があれば問題とならない","高圧・特別高圧に限り許容される"],"a":1,"e":"実態に則さない契約形態であり許容されない。最終使用者と供給元に契約関係がなく簡易・迅速なスイッチングができない点でも需要家保護上許容し得ない。"},{"c":5,"p":"p.36","q":"無登録の者が需要家に代わり契約名義人となり電気を提供した場合の罰則はどれか。","o":["3年以下の懲役又は500万円以下の罰金等","1年以下の懲役又は100万円以下の罰金等","2年以下の懲役又は300万円以下の罰金等","6月以下の懲役又は50万円以下の罰金等"],"a":1,"e":"法第2条の2に違反する無登録営業として、法第117条の2第1号により1年以下の懲役若しくは100万円以下の罰金又はこれらの併科の対象となり得る。"},{"c":5,"p":"p.37","q":"既自由化部門における「問題となる既存契約」について、契約期間が長期間残っている場合の是正時期の目途はどれか。","o":["平成31年1月","平成32年4月","契約期間の満了時","平成30年4月"],"a":0,"e":"契約期間満了時、契約期間が長期間残っている場合は契約満了を待たず平成31年1月目途に契約関係の是正が求められる。"},{"c":5,"p":"p.37","q":"「問題となる既存契約」の期間延長・更新等の可否はどれか。","o":["需要家の同意があれば許容される","許容されない","契約期間内であれば許容される","1回に限り許容される"],"a":1,"e":"期間延長・更新等を行うことは許容されない。需要家が早期の是正を希望する場合は速やかに応じることが求められる。"},{"c":5,"p":"p.37","q":"「一定の特別な関係」が明らかに認められない例として指針が挙げているものはどれか。","o":["親子会社関係にあること","電気料金を実質的に負担していること","親子関係にあること","自己の会員であること"],"a":3,"e":"自己の会員であることや取引先であることのみを理由とし、それ以上の関係がない者の契約者となる場合は、特別な関係が明らかに認められない例とされる。"},{"c":5,"p":"p.41","q":"取次ぎにおいて小売供給契約を締結する当事者の組合せはどれか。","o":["需要家と取次業者","取次業者と小売電気事業者","需要家と一般送配電事業者","需要家と小売電気事業者"],"a":0,"e":"取次ぎでは小売供給契約は需要家と取次業者の間で締結され、小売電気事業者が契約締結主体とならない点が他の類型と異なる。"},{"c":5,"p":"p.38","q":"媒介・取次・代理業者が需要家に対して負う義務はどれか。","o":["説明義務のみで書面交付義務は課されない","契約締結後の書面交付義務のみが課される","説明義務及び契約締結前・締結後の書面交付義務","苦情等の処理義務及び供給能力の確保義務"],"a":2,"e":"媒介等を行う場合、媒介・取次・代理業者は法第2条の13及び第2条の14に基づく説明義務及び書面交付義務を負う。"},{"c":5,"p":"p.40","q":"媒介・取次・代理業者が媒介等をしようとするときに説明する義務がある事項はどれか。","o":["小売電気事業者から受け取る媒介手数料の額及び算定方法","自己の資本金の額及び従業員数並びに設立の年月日","小売電気事業者の財務状況及び供給力の確保状況","小売電気事業者の名称及び自己の行為が媒介等であること"],"a":3,"e":"施行規則第3条の12第1項第1号及び第2号により、小売電気事業者の名称や自己が行う行為が媒介等であること等の説明義務が課されている。"},{"c":5,"p":"p.40","q":"B電力の代理店であるA社の広告表示として許容されないものはどれか。","o":["〇〇電気","〇〇電気　A社の電気を供給します","〇〇電気　B電力の電気を供給します","〇〇電気　powered by B電力"],"a":1,"e":"A社は代理店等であり電気の供給を行わないため、「A社の電気を供給します」は虚偽の営業活動にあたり許容されない。"},{"c":5,"p":"p.41","q":"取次ぎを行う場合に託送供給契約を締結する主体はどれか。","o":["小売電気事業者","代表契約者","需要家","取次業者"],"a":0,"e":"小売供給の主体は小売電気事業者であるため、託送供給契約は小売電気事業者が一般送配電事業者又は配電事業者との間で締結する。"},{"c":5,"p":"p.41","q":"取次業者がさらに他の者に取次ぎを委託する「順次取次ぎ」の可否はどれか。","o":["行わないことが必要である","小売電気事業者の承諾があれば認められる","契約で定めれば認められる","1段階までは認められる"],"a":0,"e":"順次取次ぎ及び需要家側の取次ぎを行わないことが必要で、これに違反する行為は問題となる。"},{"c":5,"p":"p.41","q":"取次ぎにおいて電気事業法上の苦情等の処理義務を負う主体はどれか。","o":["小売電気事業者","小売電気事業者と取次業者の連帯","一般送配電事業者","取次業者"],"a":0,"e":"供給能力の確保や苦情等の処理等の義務は小売電気事業者が負う。小売電気事業者が責任を負う前提で取次業者も苦情等の処理を行うことは妨げられない。"},{"c":5,"p":"p.41","q":"小売電気事業者が取次業者の債務不履行を理由に取次契約を解除する場合に求められる対応はどれか。","o":["需要家に対する供給停止の予告通知を行う措置","需要家に他の取次業者を紹介するのみの措置","従前と同等の契約を需要家と直接締結する等の措置","託送供給契約の名義を取次業者へ変更する措置"],"a":2,"e":"取次契約の解除等により需要家が不利益を受けないよう、十分な需要家保護策をとることが求められる。"},{"c":5,"p":"p.42","q":"高圧一括受電事業者等の電気事業法上の位置づけはどれか。","o":["登録特定送配電事業者に該当する","小売電気事業者として登録が必要となる","電気事業法上の位置づけはない","電気事業法上の需要家と位置づけられる"],"a":3,"e":"受電実態を有する高圧一括受電事業者等（マンション管理組合を含む）は電気事業法上の需要家と位置づけられ、一の需要場所内での電気のやりとりは規制対象外となる。"},{"c":5,"p":"p.43","q":"高圧一括受電等の導入決議のための住民説明会について、指針の記述はどれか。","o":["高圧一括受電事業者等が十分な説明を行うことが望ましい","住民説明会の開催が電気事業法上義務付けられている","説明は管理組合の理事会に対して行えば足りる","小売電気事業者に対し説明義務が課されている"],"a":0,"e":"申込みを受けた場合の同等の説明・書面交付に加え、住民説明会等が行われる場合にも十分な説明を行うことが望ましいとされる。"},{"c":5,"p":"p.44","q":"小売電気事業者が業務委託を行う場合でも、自ら行うことが必要とされる事項はどれか。","o":["託送供給契約の締結と計画値同時同量対応","供給能力の確保と苦情等の処理","需要家への小売供給と託送供給契約の締結","需要家への小売供給と苦情等の処理"],"a":2,"e":"①自ら需要家に小売供給を行うこと、②自ら一般送配電事業者又は配電事業者等と託送供給契約を締結することが必要で、これらの主体を他の者に変更する行為は問題となる。"},{"c":6,"p":"p.46","q":"小売供給契約における電気料金の算出方法の定め方として、問題となるものはどれか。","o":["「当社が毎月末に請求する額」と定めること","燃料費調整の算定式を約款に定めること","時間帯別に単価を定めること","明確な算式で卸電力取引価格に連動させること"],"a":0,"e":"「当社が毎月末に請求する額」や「時価」など算出方法を明確に定めないことは、料金水準の適切性の判断を著しく困難にするため問題となる。"},{"c":6,"p":"p.46","q":"何らかの明確な算式に基づき日本卸電力取引所の取引価格に連動する形で料金を定める契約の評価はどれか。","o":["低圧では問題となる","届出があれば問題とならない","原則として問題となる","問題がないと考えられる"],"a":3,"e":"明確な算式に基づく市場連動型の料金設定は、料金水準の判断を困難にする弊害がなく問題がないと考えられる。"},{"c":6,"p":"p.46","q":"解除等を著しく制約する契約条項の例として、指針が挙げていないものはどれか。","o":["更新を拒否できる期間を極めて短く設定すること","契約期間を1年間と定めること","解除等を一切許容しない期間を設定すること","不当に高額の違約金等を設定すること"],"a":1,"e":"契約期間を定めること自体は問題ではない。他の3つは解除等を著しく制約する契約条項の例として挙げられている。"},{"c":6,"p":"p.46","q":"自動更新の小売供給契約において、更新を拒否できる期間を極めて短い期間に設定することの評価はどれか。","o":["望ましくないにとどまる","約款に定めれば問題とならない","低圧の場合のみ問題となる","問題となる"],"a":3,"e":"需要家が更新を不要と考えた場合に容易に更新を拒否できないような契約条項を設けることは問題となる。"},{"c":6,"p":"p.47","q":"解除等を著しく制約する行為の例として、指針が挙げているものはどれか。","o":["コールセンターに電話しても担当者につながないこと","解除時に発生する違約金の金額及び根拠を説明すること","解除の申出を書面の郵送により受け付けること","解除手続の方法をホームページに掲載すること"],"a":0,"e":"解除や更新拒否の申出に応じないこと（速やかに対応しないことを含む）や、解除手続・更新拒否手続の方法を明示しないことが例示されている。"},{"c":6,"p":"p.47","q":"需要家からの解除手続又は自動更新を拒否する手続の方法を明示しないことの評価はどれか。","o":["望ましくないにとどまる","問題とならない","問題となる","問合せがあれば説明すれば足りる"],"a":2,"e":"解除等を著しく制約する行為として問題となる。"},{"c":6,"p":"p.47","q":"転居する需要家について、違約金等を負担することなく解除等できるよう措置することが望ましいのはどの場合か。","o":["転居の理由が会社都合の転勤であると確認できる場合","転居先が現在の供給区域と異なる都道府県である場合","契約期間の半分以上を既に経過している場合","転居先で自己から小売供給を受けることができない場合"],"a":3,"e":"事業展開地域外への転居では需要家側で対応を取り得ないため、解除等申出時点で自己から供給を受けられない場所への転居の場合に措置することが望ましい。"},{"c":6,"p":"p.47","q":"転居に伴い託送供給契約の解除等・変更を理由に発生した工事費の精算金について、正しいものはどれか。","o":["需要家に一切請求することができないとされている","違約金として定額で請求することが認められている","一般送配電事業者が需要家へ直接請求するとされる","合理的な範囲で需要家に請求することは妨げられない"],"a":3,"e":"短期間での託送供給契約の解除等・変更を理由に請求された料金及び工事費の精算金や、リース債務残額の支払義務が発生する場合、合理的な範囲での請求は妨げられない。"},{"c":6,"p":"p.47","q":"競合相手を市場から退出させる目的での不当に安い価格での小売供給の評価はどれか。","o":["低圧分野における小売供給に限って問題となる","独占禁止法上の問題が生じるにとどまり指針上は問題ない","価格設定は当事者の自由であるため問題とならない","電気事業の健全な発達に支障が生じる場合は問題となる"],"a":3,"e":"公正な競争を阻害するおそれがあり、これにより電気事業の健全な発達に支障が生じる（又は生ずるおそれがある）と認められる場合には問題となる。"},{"c":6,"p":"p.46","q":"取次業者が電気料金の算出方法を明確に定めない契約を締結した場合の小売電気事業者の責任はどれか。","o":["取次業者のみが責任を負い小売電気事業者は問われない","契約主体でないため小売電気事業者は責任を負わない","指導・監督が適切でなければ自身の行為が問題となる","事後に契約を是正すれば責任を問われることはない"],"a":2,"e":"取次業者が問題となる行為をしたときでも、小売電気事業者による指導・監督が適切でない場合には小売電気事業者自身の行為が問題となる。"},{"c":7,"p":"p.48","q":"小売電気事業者の苦情等の処理義務の根拠条文はどれか。","o":["電気事業法第2条の12","電気事業法第2条の13","電気事業法第2条の17","電気事業法第2条の15"],"a":3,"e":"小売供給の業務の方法又は料金その他の供給条件についての苦情及び問合せを適切かつ迅速に処理する義務は法第2条の15による。"},{"c":7,"p":"p.48","q":"苦情等の処理義務の対象となる者の範囲はどれか。","o":["現に小売供給契約を締結している需要家に限る","需要家（小売供給を受けようとする者を含む）","低圧の小売供給を受けている需要家に限る","現に契約中の需要家及び過去の需要家に限る"],"a":1,"e":"「需要家（小売供給を受けようとする者を含む。）」からの苦情及び問合せが対象となる。"},{"c":7,"p":"p.48","q":"苦情・問合せに応じることのできる連絡先について、求められる対応はどれか。","o":["毎月の請求書にのみ記載しておけば足りる","需要家から求められた場合に個別に伝えれば足りる","説明時に加えホームページ等でも確認できるようにする","契約締結後交付書面にのみ記載しておけば足りる"],"a":2,"e":"供給条件の説明の際に説明するほか、当該小売電気事業者等のホームページ等においても確認できるようにすることが求められる。"},{"c":7,"p":"p.48","q":"苦情及び問合せが通常よりも増加することが見込まれる場合として、指針が挙げているものはどれか。","o":["事業の休廃止や供給条件の変更をしようとする場合","検針日の変更を需要家に通知しようとする場合","供給地点数が前年より大きく増加している場合","新規顧客獲得キャンペーンを実施しようとする場合"],"a":0,"e":"これらの場合には必要に応じて苦情等の処理体制を見直すことが求められ、適切な対応を怠ることは問題となる。"},{"c":7,"p":"p.48","q":"原因が不明な停電について、問題となる行為はどれか。","o":["電気工事店の連絡先を需要家に紹介すること","一般送配電事業者等の連絡先を需要家に伝えないこと","一般送配電事業者の停電情報を需要家に案内すること","ブレーカーの操作方法を需要家に案内すること"],"a":1,"e":"需要家の相談に一切応じない、一般送配電事業者等の連絡先を伝えないなど不当に応じないことは苦情等の処理義務に反する可能性があり問題となる。"},{"c":7,"p":"p.48","q":"送配電設備の要因で停電していることが明らかな場合の望ましい対応はどれか。","o":["一般送配電事業者へ直接連絡するよう伝えるにとどめる","復旧の見込み時期を独自に推定して回答する","小売電気事業者が現地で設備の調査を実施する","一般送配電事業者等の情報を用いて問合せに対応する"],"a":3,"e":"一般送配電事業者又は配電事業者がホームページ等を通じて提供する情報を用いて、小売電気事業者が問合せに対応することが望ましい。"},{"c":7,"p":"p.48","q":"送配電要因による停電時に、一般送配電事業者及び配電事業者について望ましいとされる行為はどれか。","o":["小売電気事業者へ復旧計画を事前提出すること","小売電気事業者に停電情報を適時に提供すること","停電情報を非公開とすること","需要家に直接復旧見込みを通知すること"],"a":1,"e":"一般送配電事業者及び配電事業者は小売電気事業者に対して、停電情報をホームページ等を通じて適時に提供することが望ましいとされる。"},{"c":7,"p":"p.49","q":"原因が不明な停電に対し、助言によっても解決しない場合の望ましい対応はどれか。","o":["需要家自身に設備の調査を依頼して結果を待つ","一般送配電事業者や電気工事店の適切な連絡先を紹介する","翌営業日に折り返す旨のみを伝えて対応を終える","原因が特定できるまで需要家への回答を一切留保する"],"a":1,"e":"ブレーカーの操作方法の案内等の適切な助言を行い、解決しない場合は原因特定のため適切な連絡先を紹介することが望ましい。"},{"c":8,"p":"p.50","q":"小売供給契約の解除等の申出を受けた際の本人確認の方法として、指針が例示するものはどれか。","o":["申出者の氏名のみを口頭により確認する","氏名及び電話番号の下4桁のみを確認する","氏名、住所及び契約者番号のすべてを確認する","供給地点特定番号のみを照合して確認する"],"a":2,"e":"適切な方法による本人確認が必要であり、これを怠り需要家本人の意に沿わない解除等手続を行うことは問題となる。"},{"c":8,"p":"p.50","q":"過度な本人確認を行うことなどにより解除等に速やかに対応しない行為の呼称と評価はどれか。","o":["引き留め営業として望ましくない","引き延ばし営業として問題となる","正当な確認行為として問題とならない","本人確認義務の履行として必要である"],"a":1,"e":"過度な「引き留め営業」や「引き延ばし営業」により正当な理由なく速やかに解除等に応じないことは問題となる。"},{"c":8,"p":"p.50","q":"需要家から取次業者との契約の解除等の申出を受けた小売電気事業者に求められる対応はどれか。","o":["契約主体でないため対応を要しないこと","取次業者に連絡するなどの対応を速やかに取ること","需要家に取次業者へ直接申し出るよう伝えること","解除日を1か月後に設定すること"],"a":1,"e":"取次業者に連絡するなどの対応を速やかに取らないことも、解除等に速やかに対応しない問題となる行為に含まれる。"},{"c":8,"p":"p.51","q":"取戻し営業行為から除かれるのはどのような場合か。","o":["スイッチング完了後に行う場合","メールで行う場合","違約金の説明を名目とする場合","需要家の要請を受けて行う場合"],"a":3,"e":"取戻し営業行為は、スイッチング情報を知りながら申込みを撤回させることを目的とする行為をいうが、需要家の要請を受けて行う場合は除かれる。"},{"c":8,"p":"p.51","q":"切替え前の小売電気事業者による違約金の説明について、正しい評価はどれか。","o":["説明自体は問題ないが正当な理由のない繰り返しは問題となる","説明であればいかなる頻度で行っても問題とならない","書面による説明に限り行うことが認められている","スイッチング情報を知った後の需要家への接触は一切問題となる"],"a":0,"e":"金額・算定・根拠条項の説明は問題とならないが、違約金の説明を名目に正当な理由なく繰り返す行為は取戻し営業行為として問題となる。"},{"c":8,"p":"p.51","q":"特定商取引法上、クーリング・オフの適用除外とされている電気の供給の組合せはどれか。","o":["高圧及び特別高圧の小売供給並びにセット販売","訪問販売による全ての小売供給及び媒介契約","最終保障供給、離島等供給及び特定小売供給","セット販売及び市場連動型料金による小売供給"],"a":2,"e":"特商法第26条第4項第2号等により3類型が適用除外とされ、これ以外の訪問販売・電話勧誘販売による契約はクーリング・オフの対象となる。"},{"c":8,"p":"p.51","q":"クーリング・オフを理由に託送供給契約を解除等する場合に必要な対応はどれか。","o":["一般送配電事業者等に通知した上で解除等をすること","経済産業大臣にその旨を届け出て解除等をすること","需要家に代わって最終保障供給を申し込むこと","解除等の後に速やかに需要家へ通知すること"],"a":0,"e":"一般送配電事業者又は配電事業者が適切な需要家保護措置をとれるよう、その旨を通知した上で解除等をすることが必要。"},{"c":8,"p":"p.52","q":"無契約状態となる需要家に対する一般送配電事業者等の供給停止の予告通知の時期はどれか。","o":["供給停止を行う10日程度前まで","供給停止を行う30日程度前まで","供給停止を行う5日程度前まで","供給停止を行う15日程度前まで"],"a":2,"e":"供給停止日を明示して、契約を締結しない場合は無契約状態を理由とする供給停止になる旨の予告通知を5日程度前までに行う。"},{"c":8,"p":"p.52","q":"供給停止に当たり検討することが前提とされる需要家への配慮措置の例はどれか。","o":["代替となる小売電気事業者を指定する対応","1アンペアブレーカーの取り付け等の対応","未払分の電気料金を免除するという対応","供給停止の実施を1年間猶予するという対応"],"a":1,"e":"供給継続の要望があった場合の1アンペアブレーカーの取り付け等や、在宅医療者・生活保護受給者等であることが確認できた場合の配慮措置を検討した上で行うことが前提となる。"},{"c":8,"p":"p.52","q":"取戻し営業行為の防止に関し、望ましいとされる体制整備はどれか。","o":["スイッチング情報の社内情報管理体制の構築と社内教育","解約受付部門を営業部門へ集約する体制の構築","スイッチング情報の営業部門への即時共有と活用","切替えを申し込んだ需要家への一律の再提案"],"a":0,"e":"社内の情報管理体制の構築、営業活動に関わる役職員への社内教育、問題となる行為等の周知徹底など適切な社内管理体制の構築が望ましい。"},{"c":8,"p":"p.52","q":"解除等手続等に関する体制について望ましいとされるものはどれか。","o":["解除の申出は書面の郵送によってのみ受け付ける","解除の申出は契約者本人の対面手続に限定する","解除の申出は営業所での来店受付に限定する","電話・ホームページ・電子メール等から選択できる"],"a":3,"e":"需要家による解除等手続の円滑化のため、複数の方法から選択して利用できるようにすることが望ましい。"},{"c":8,"p":"p.53","q":"需要家の責めに帰すべき事由によらず事業者側から解除等する場合、低圧契約で確保すべき期間はどれか。","o":["120日","30日","60日","90日"],"a":2,"e":"低圧契約は60日、高圧契約及び特別高圧契約はいずれも90日を、解除等を希望する日の前日から起算して確保する必要がある。"},{"c":8,"p":"p.53","q":"需要家の責めに帰すべき事由によらず事業者側から解除等する場合、高圧契約で確保すべき期間はどれか。","o":["120日","30日","60日","90日"],"a":3,"e":"高圧契約及び特別高圧契約はいずれも90日。低圧契約は60日。"},{"c":8,"p":"p.53","q":"解除等の申出に併せて需要家に通知すべき内容として、指針が挙げていないものはどれか。","o":["未払電気料金の請求予定額","契約解約等をする理由","無契約となれば供給が止まることや最終保障供給の申込方法","小売供給の停止の年月日"],"a":0,"e":"通知すべきは停止年月日、解約等の理由、苦情等の連絡先、無契約となれば供給が止まることや最終保障供給の申込方法。代替供給者がある場合はその連絡先等を説明することが適当とされる。"},{"c":8,"p":"p.53","q":"小売電気事業を休廃止しようとする場合、高圧契約について周知が必要な時期はどれか。","o":["休廃止日の前日から起算して30日前まで","休廃止日の前日から起算して90日前まで","休廃止日の前日から起算して60日前まで","休廃止日の前日から起算して120日前まで"],"a":1,"e":"施行規則第3条の11により原則60日前、高圧契約・特別高圧契約及び小売供給の相手が1万件以上の事業は90日前までの周知が必要。"},{"c":8,"p":"p.54","q":"料金未払を理由に解除等する場合、需要家への解除等の予告通知の時期はどれか。","o":["解除等を行う5日程度前まで","解除等を行う30日程度前まで","解除等を行う10日程度前まで","解除等を行う15日程度前まで"],"a":3,"e":"15日程度前までに解除等日及び理由を明示して予告通知を行い、託送供給契約の解除の10日程度前までに一般送配電事業者等へ連絡する。"},{"c":8,"p":"p.54","q":"料金未払を理由とする解除等に伴い、一般送配電事業者等へ託送供給契約の解除を連絡すべき時期はどれか。","o":["解除を行う5日程度前まで","解除を行う15日程度前まで","解除を行う30日程度前まで","解除を行う10日程度前まで"],"a":3,"e":"小売電気事業者側からの解除等を理由とすることを明示した上で、10日程度前までに連絡を行う必要がある。"},{"c":8,"p":"p.56","q":"一般送配電事業者が小売電気事業者の託送料金未払等を理由に託送供給契約を解除する場合、需要家への予告通知の時期はどれか。","o":["1月程度前及び5日程度前の各々の時期","供給停止の5日程度前の1回のみの時期","10日程度前及び3日程度前の各々の時期","供給停止の30日程度前の1回のみの時期"],"a":0,"e":"各々の時期に供給停止日を明示して予告通知を行い、他の小売電気事業者との契約締結又は最終保障供給の申込方法の説明も必要となる。"},{"c":9,"p":"p.58","q":"小売電気事業者等が供給条件の説明義務に違反した場合の効果はどれか。","o":["直ちに登録が取り消される","業務改善命令等が発動され得る","行政指導のみが行われる","直ちに罰金が科される"],"a":1,"e":"説明義務違反は法第2条の17第2項に基づく業務改善命令等の対象となり得る。"},{"c":9,"p":"p.58","q":"経済産業大臣の業務改善命令に違反した場合の罰則はどれか。","o":["100万円以下の罰金","300万円以下の罰金","1年以下の懲役","30万円以下の罰金"],"a":1,"e":"法第118条第1号により300万円以下の罰金の対象となり得る。契約締結後交付書面の不交付・虚偽記載は30万円以下の罰金（法第120条第2号）。"},{"c":9,"p":"p.58","q":"業務改善命令違反により登録の取消事由となるのはどのような場合か。","o":["需要家からの苦情が多数寄せられたとき","命令に係る罰金刑が確定したとき","同一の違反が2回以上繰り返されたとき","公共の利益を阻害すると認められるとき"],"a":3,"e":"命令違反があった場合において公共の利益を阻害すると認められるときは、法第2条の9第1項第1号の登録の取消事由となる。"},{"c":9,"p":"p.58","q":"供給条件の「説明」として必要とされる程度はどれか。","o":["情報を入手できる状態とすること","需要家の署名を得ること","需要家の理解の形成を図ること","情報を需要家に伝達すること"],"a":2,"e":"情報を入手できる状態とする、あるいは伝達するだけでは不十分で、需要家が一通り聴きあるいは読むなどして理解の形成を図ることが必要とされる。"},{"c":9,"p":"p.59","q":"供給条件の説明方法として認められ得るものはどれか。","o":["対面による方法に限る","オンライン・サインアップによる方法","口頭又は電話による方法に限る","書面の郵送による方法は不可"],"a":1,"e":"適切な対応を取ることにより、オンライン・サインアップやダイレクトメール・パンフレットによる説明でも説明義務を果たすことは可能とされる。"},{"c":9,"p":"p.59","q":"施行規則第3条の12第1項第1号として説明すべき事項はどれか。","o":["小売供給契約の申込みの方法及び受付の期間","小売電気事業者の氏名又は名称及び登録番号","苦情や問合せに応ずるための連絡先及び時間帯","媒介等を行う旨及び媒介等業者の氏名又は名称"],"a":1,"e":"第1号＝小売電気事業者の氏名又は名称及び登録番号、第2号＝媒介等を行う旨と媒介等業者の名称、第3号＝苦情等の連絡先と対応時間帯、第5号＝申込みの方法。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第9号として説明すべき事項はどれか。","o":["契約電力又は契約電流の値及びその決定方法","供給電圧及び周波数並びに供給の方式","小売供給の開始の予定年月日及び申込方法","電気計器その他の用品及び工事に関する費用の負担"],"a":3,"e":"第9号は電気計器その他の用品及び配線工事その他の工事に関する費用の負担に関する事項。費用負担の有無や算定方法などを説明する。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第14号の内容として、指針が例示しているものはどれか。","o":["需給調整契約の内容及び実施手順の規定","計量器の検定有効期間及び取替えの時期の規定","力率の測定方法及び力率割引に関する規定","検針日、料金の算定期間・算定方法、日割計算の規定"],"a":3,"e":"第14号は供給電力及び供給電力量の計測方法並びに料金調定の方法。検針日、料金の算定期間・算定方法、使用電力量の計量方法及び日割計算に関する規定を設けることなどが考えられる。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第16号（託送供給等約款に定められた需要家の責任に関する事項）の内容として、指針が想定するものはどれか。","o":["工事のための需要家の敷地内への立入りの許可等の協力","需要家が自ら保安規程を定めて届け出ること","需要家が使用電力量を自ら計量して報告すること","需要家が託送料金を一般送配電事業者へ直接支払うこと"],"a":0,"e":"立入りの許可等の協力のほか、託送供給等に伴う需要家の協力、保安等や調査に対する協力に関する規定の概要を分かりやすく記載することが必要。"},{"c":9,"p":"p.61","q":"施行規則第3条の12第1項第18号（契約の更新に関する事項）として、指針が例示している内容はどれか。","o":["事業者側から自動更新の拒否を行う場合の旨及び手続","更新時に全ての説明事項を再度説明するという旨","更新後に適用される料金水準の見通しとその根拠","更新の拒否は需要家からのみ行えるという旨"],"a":0,"e":"小売電気事業者又は取次業者からの申出により自動更新の拒否を行うことがある場合には、その旨及びその際の手続に関する規定を設けることが考えられるとされている。"},{"c":9,"p":"p.61","q":"施行規則第3条の12第1項第24号として説明すべき事項はどれか。","o":["二酸化炭素排出係数及びその算定の根拠","電源構成の前年度実績値及び当年度計画値の数値","非化石証書の使用量及び再エネ指定の有無","電源構成等を電気の特性とする場合の内容及び根拠"],"a":3,"e":"第24号は電源構成等を供給する電気の特性とする場合のその内容及び根拠。「〇〇地域産電力」「地産地消」を訴求する場合の説明もこの号による。"},{"c":9,"p":"p.61","q":"既に締結されている契約を更新する場合（期間の延長のみ）に説明すべき事項はどれか。","o":["更新後の契約期間のみ","すべての説明事項","更新後の契約期間及び料金","変更しようとする事項のみ"],"a":0,"e":"施行規則第3条の12第3項による。ただし需要家が一部省略を承諾しない場合は全事項の説明が必要（同項ただし書）。"},{"c":9,"p":"p.61","q":"軽微な変更以外の契約の変更をしようとする場合に説明すべき事項はどれか。","o":["変更しようとする事項の概要のみ","変更しようとする事項のみ","すべての説明事項","変更しようとする事項及び料金"],"a":1,"e":"施行規則第3条の12第4項による。例えばコールセンターの外部委託で連絡先が変わる場合は当該電話番号の説明で足りる。"},{"c":9,"p":"p.62","q":"契約の「軽微な変更」をしようとする場合に説明すべき事項はどれか。","o":["変更しようとする事項の全文","すべての説明事項","変更後の契約期間","変更しようとする事項の概要"],"a":3,"e":"法令改正に伴う条ずれのように実質的変更を伴わない変更をいい、概要の説明で足りる。複数箇所の引用がある場合も一つ一つの説明は要しない。"},{"c":9,"p":"p.62","q":"料金の値上げの説明方法として、十分な説明がなされたとはいえないと解される例はどれか。","o":["請求書の裏面に8ポイント未満の文字で記載するだけの方法","変更しようとする事項を記載した電子メールを送る方法","変更しようとする事項を記載した書面を郵送する方法","対面により変更しようとする事項を口頭で説明する方法"],"a":0,"e":"裏面に小さな文字で記載するだけの方法や、変更事項の具体的内容に触れずリンクのみを掲載する方法は不十分。リンク先に具体的説明の記載がない場合も不十分と解される。"},{"c":9,"p":"p.64","q":"電話により供給条件の説明を行い、需要家の承諾を得て契約締結前交付書面を交付しなかった場合の取扱いはどれか。","o":["需要家から請求があった場合に交付する","説明後遅滞なく交付しなければならない","契約締結前交付書面の交付は一切不要となる","契約を締結した時点で交付すれば足りる"],"a":1,"e":"施行規則第3条の12第7項第1号により説明時の交付は要しないが、同条第8項により電話説明後遅滞なく交付しなければならない。"},{"c":9,"p":"p.65","q":"契約締結前交付書面に代わる電磁的方法について、需要家の承諾を得る方法として認められないものはどれか。","o":["書面による承諾を得る方法","電話における口頭の承諾を録音する方法","電磁的方法の種類と内容を示した上で承諾を得る方法","電磁的方法による承諾を得る方法"],"a":1,"e":"あらかじめ電磁的方法の種類及び内容を示し、書面又は電磁的方法による承諾を得ることが必要で、電話での口頭承諾の録音は認められない。"},{"c":9,"p":"p.66","q":"ホームページ等での閲覧により書面に代える場合、需要家が説明事項を出力できないときの保存期間はどれか。","o":["3ヶ月間","1ヶ月間","6ヶ月間","1年間"],"a":0,"e":"当該ホームページ等に表示した説明事項について3ヶ月間は消去・改変できないようにしなければならない。"},{"c":9,"p":"p.67","q":"契約締結後交付書面に固有の記載事項はどれか。","o":["媒介・取次・代理業者の登録番号","小売電気事業者の資本金","小売供給契約の申込みの方法","供給地点特定番号"],"a":3,"e":"停電時の復旧対応等に必要な供給地点特定番号の記載が必要。一方、第5号の「申込みの方法」は契約締結時には不要であるため対象外となる。"},{"c":9,"p":"p.67","q":"媒介業者における契約締結後交付書面の交付時期はどれか。","o":["媒介により契約が成立したとき","供給を開始したとき","契約を締結したとき","需要家から請求があったとき"],"a":0,"e":"媒介業者は契約の締結を行う主体ではないため、「契約を締結したとき」ではなく「媒介により契約が成立したとき」に交付が必要となる。"},{"c":10,"p":"p.70","q":"料金高騰リスクへの対応について、指針が期待している小売電気事業者の姿勢はどれか。","o":["調整上限のあるメニューに一本化して提供する","市場連動型のメニューの提供を段階的に控える","燃料費調整を行わない料金メニューに統一する","価格変動リスクに備えられる料金メニューを提示する"],"a":3,"e":"多様な選択肢から需要家が選好に応じたメニューを選択できる状況の実現と需要家保護の観点から、様々な料金メニューを選択肢として提示することが期待される。"},{"c":10,"p":"p.71","q":"「完全定額料金プラン」の仕組みとして正しいものはどれか。","o":["使用量に応じて単価が逓減する","基本料金のみ固定で従量料金は市場連動となる","燃料費調整に上限を設ける","従量料金が存在せず固定料金のみ存在する"],"a":3,"e":"需要家は燃料費・市場価格の変動リスクと使用量増リスクから遮断されるが、事業者が全リスクを負うため一定のプレミアムが料金に乗る可能性がある。"},{"c":10,"p":"p.71","q":"「基本料金・従量料金単価が固定されたプラン」における需要家の主なリスクはどれか。","o":["契約期間中に調整上限が見直される場合があること","燃料費・市場価格の下落局面でも値下げはないこと","燃料費や市場価格の高騰時に単価が上昇すること","使用電力量が増加した場合に単価が上昇すること"],"a":1,"e":"需要家は変動リスクから遮断される一方、下落局面でも値下げはない。事業者は変動リスクを全て負うためヘッジ対策が必要となる。"},{"c":10,"p":"p.72","q":"「調整上限設定プラン」で事後払いの仕組みがない場合、高騰時の調整上限超過分を負担するのは誰か。","o":["一般送配電事業者","小売電気事業者","国","需要家"],"a":1,"e":"調整上限超過分は事後払いの仕組みとすることもあり得るが、その仕組みがない場合は高騰時の超過分を事業者が負担することになる。"},{"c":10,"p":"p.72","q":"「非調整バンド設定プラン」の仕組みとして正しいものはどれか。","o":["料金単価の調整を実施しない一定の変動幅を設定する","市場価格連動項を設けず燃料費調整のみを行う","燃料費調整の調整上限のみを供給約款に設定する","一定期間にわたり料金単価の調整を停止する"],"a":0,"e":"変動幅がバンド内であれば需要家は変動リスクから遮断されるが下落局面でも値下げはない。バンドを超える場合は需要家が変動リスクを負う。"},{"c":10,"p":"p.73","q":"「連動プラン」について、事業者側の主なリスク・コスト欄に記載されている内容はどれか。","o":["調整上限を超過した分を事業者が負担することになる","他のメニューに比してもより丁寧な説明が期待されること","燃料費が下落しても収入が変動しなくなること","非調整バンドの見直しを定期的に行う必要があること"],"a":1,"e":"連動プランは需要家が背負う変動リスクが大きい一方、事業者は変動リスクを軽減できる。その分、より丁寧な説明が期待される。"}]};
const QS = DATA.questions, CHS = DATA.chapters;
const $ = id => document.getElementById(id);
const chName = c => (CHS.find(x => x.id === c) || {}).name || "";

let quiz = [], idx = 0, answered = false, hits = 0, log = [];

/* ---------- 設定画面 ---------- */
function buildChapters(){
  $("totalq").textContent = QS.length;
  $("chapters").innerHTML = CHS.map(ch => {
    const n = QS.filter(q => q.c === ch.id).length;
    return '<label><input type="checkbox" class="chk" value="' + ch.id + '" checked>' +
           '<span class="ch-name">' + ch.id + '. ' + ch.name + '</span>' +
           '<span class="ch-meta">' + ch.range + '／' + n + '問</span></label>';
  }).join("");
  document.querySelectorAll(".chk").forEach(c => c.addEventListener("change", updatePool));
  updatePool();
}
const picked = () => Array.from(document.querySelectorAll(".chk:checked")).map(c => +c.value);
function pool(){ const p = picked(); return QS.filter(q => p.includes(q.c)); }
function updatePool(){
  const n = pool().length;
  $("poolinfo").textContent = n ? "選択中の範囲：" + n + "問" : "章を1つ以上選んでください。";
  $("start").disabled = n === 0;
}
$("selAll").onclick = () => { document.querySelectorAll(".chk").forEach(c => c.checked = true); updatePool(); };
$("selNone").onclick = () => { document.querySelectorAll(".chk").forEach(c => c.checked = false); updatePool(); };

/* ---------- 出題 ---------- */
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQuiz(list){
  quiz = list; idx = 0; hits = 0; log = [];
  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("qtotal").textContent = quiz.length;
  render();
  window.scrollTo(0, 0);
}
$("start").onclick = () => {
  let list = pool().slice();
  if($("order").value === "random") shuffle(list); else list.sort((a, b) => QS.indexOf(a) - QS.indexOf(b));
  const n = +$("numq").value;
  if(n > 0) list = list.slice(0, n);
  startQuiz(list);
};
$("quit").onclick = () => {
  $("quiz").classList.add("hidden");
  $("setup").classList.remove("hidden");
  window.scrollTo(0, 0);
};

function render(){
  answered = false;
  const q = quiz[idx];
  $("qnum").textContent = idx + 1;
  $("hit").textContent = hits;
  $("prog").style.width = (idx / quiz.length * 100) + "%";
  $("tagchap").textContent = "第" + q.c + "章　" + chName(q.c);
  $("tagpage").textContent = "指針 " + q.p;
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.o.map((t, i) =>
    '<button class="opt" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + esc(t) + '</span></button>'
  ).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("verdict").innerHTML = "";
  $("qactions").innerHTML = "";
}
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function answer(i){
  if(answered) return;
  answered = true;
  const q = quiz[idx], ok = i === q.a;
  if(ok) hits++;
  log.push({ q: q, picked: i, ok: ok });
  $("hit").textContent = hits;
  document.querySelectorAll(".opt").forEach(b => {
    const bi = +b.dataset.i;
    b.disabled = true;
    if(bi === q.a) b.classList.add("correct");
    else if(bi === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  $("verdict").innerHTML =
    '<div class="verdict ' + (ok ? "ok" : "ng") + '"><h3>' + (ok ? "正解" : "不正解") + '</h3>' +
    '<p>' + esc(q.e) + '</p><span class="src">指針 ' + q.p + '　第' + q.c + '章 ' + chName(q.c) + '</span></div>';
  const last = idx === quiz.length - 1;
  $("qactions").innerHTML = '<button class="btn" id="next">' + (last ? "結果を見る" : "次の問題へ") + '</button>';
  $("next").onclick = next;
  $("next").focus();
}
function next(){
  if(idx === quiz.length - 1){ finish(); return; }
  idx++; render();
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", e => {
  if($("quiz").classList.contains("hidden")) return;
  if(!answered && ["1", "2", "3", "4"].includes(e.key)) answer(+e.key - 1);
  else if(answered && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); next(); }
});

/* ---------- 結果 ---------- */
function finish(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const pct = Math.round(hits / quiz.length * 100);
  $("rnum").textContent = hits;
  $("rden").textContent = quiz.length;
  $("rpct").textContent = "正答率 " + pct + "%";
  $("rjudge").textContent =
    pct >= 90 ? "指針の細部まで正確に押さえられています。" :
    pct >= 70 ? "大枠は理解できています。取りこぼした条項を該当ページで確認しましょう。" :
    pct >= 50 ? "要件や日数の取り違えが目立ちます。間違えた章を通読し直すことをおすすめします。" :
                "該当ページを参照しながら、章を絞って解き直しましょう。";

  const stats = {};
  log.forEach(r => { const c = r.q.c; stats[c] = stats[c] || { n: 0, h: 0 }; stats[c].n++; if(r.ok) stats[c].h++; });
  $("bychap").innerHTML = Object.keys(stats).sort((a, b) => a - b).map(c => {
    const s = stats[c], p = Math.round(s.h / s.n * 100);
    return '<div><span class="n">第' + c + '章 ' + chName(+c) + '</span>' +
           '<span class="g"><i style="width:' + p + '%"></i></span>' +
           '<span class="s">' + s.h + '/' + s.n + '</span></div>';
  }).join("");

  const wrong = log.filter(r => !r.ok);
  if(wrong.length === 0){
    $("reviewPanel").classList.add("hidden");
  } else {
    $("reviewPanel").classList.remove("hidden");
    $("review").innerHTML = wrong.map(r =>
      '<details><summary>' + esc(r.q.q) + '</summary><div class="body">' +
      '<p class="ans">正解：<b>' + esc(r.q.o[r.q.a]) + '</b></p>' +
      '<p class="ans yours">あなたの解答：' + esc(r.q.o[r.picked]) + '</p>' +
      '<p>' + esc(r.q.e) + '</p>' +
      '<span class="src">指針 ' + r.q.p + '　第' + r.q.c + '章 ' + chName(r.q.c) + '</span></div></details>'
    ).join("");
  }
  $("retryWrong").style.display = wrong.length ? "" : "none";
  $("retryWrong").onclick = () => startQuiz(shuffle(wrong.map(r => r.q)));
  window.scrollTo(0, 0);
}
$("again").onclick = () => {
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
  window.scrollTo(0, 0);
};

buildChapters();
</script>
</body>
</html>
