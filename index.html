<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電力の小売営業に関する指針 理解度テスト</title>
<style>
:root{
  --paper:#eceff2;
  --surface:#ffffff;
  --ink:#16222e;
  --ink-soft:#55677a;
  --line:#d3dae1;
  --brand:#12496b;
  --ok:#1b7a4b;
  --ok-bg:#eaf5ee;
  --ng:#b23b2e;
  --ng-bg:#fbeceb;
  --cite:#7a5a16;
  --cite-bg:#f6efdc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}

/* ---- header ---- */
header{
  background:var(--brand);
  color:#fff;
  border-bottom:3px solid var(--cite);
}
header .wrap{padding-top:26px;padding-bottom:24px}
h1{font-size:24px;line-height:1.4;margin:0 0 6px;letter-spacing:.01em;font-weight:700}
header p{margin:0;font-size:13.5px;color:#c3d6e4}

/* ---- panels ---- */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  padding:24px;
  margin-top:22px;
}
.panel h2{font-size:16px;margin:0 0 4px;font-weight:700}
.panel .note{font-size:13.5px;color:var(--ink-soft);margin:0 0 18px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:0;margin-bottom:10px}

.chapters{display:grid;gap:2px}
.chapters label{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 12px;border-radius:4px;cursor:pointer;
  border:1px solid transparent;
}
.chapters label:hover{background:#f4f7f9}
.chapters input{margin:0;position:relative;top:2px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.ch-name{flex:1;font-size:14.5px}
.ch-meta{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-actions{display:flex;gap:16px;margin:8px 0 0 12px}
.linkish{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{color:var(--cite)}

.row{display:flex;flex-wrap:wrap;gap:22px}
.field{flex:1 1 200px}
.field span{display:block;font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
select{
  width:100%;padding:10px 12px;font:inherit;font-size:15px;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);
}
button{font-family:inherit}
.btn{
  display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:4px;
  padding:13px 30px;font-size:15.5px;font-weight:700;cursor:pointer;line-height:1.4;
}
.btn:hover{background:#0e3a56}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.ghost:hover{background:#eef4f8}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}

/* ---- quiz ---- */
.status{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:22px;font-size:13.5px;color:var(--ink-soft);
}
.count{font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-size:19px;font-weight:700}
.bar{height:4px;background:#dde3e9;border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s ease}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{font-size:12px;padding:3px 9px;border-radius:3px;background:#eef2f5;color:var(--ink-soft)}
.tag.cite{background:var(--cite-bg);color:var(--cite);font-variant-numeric:tabular-nums}
.qtext{font-size:17.5px;line-height:1.7;font-weight:700;margin:0 0 20px}

.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:5px;
  padding:14px 16px;font-size:15px;line-height:1.65;color:var(--ink);cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--brand);background:#f6f9fb}
.opt:disabled{cursor:default}
.opt .k{
  flex:none;width:22px;height:22px;border-radius:3px;background:#eef2f5;color:var(--ink-soft);
  font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;
}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
.opt.wrong .k{background:var(--ng);color:#fff}
.opt.dim{opacity:.55}

.verdict{margin-top:20px;border-left:3px solid var(--line);padding:2px 0 2px 16px}
.verdict.ok{border-color:var(--ok)}
.verdict.ng{border-color:var(--ng)}
.verdict h3{margin:0 0 6px;font-size:15px}
.verdict.ok h3{color:var(--ok)}
.verdict.ng h3{color:var(--ng)}
.verdict p{margin:0;font-size:14.5px;line-height:1.8}
.verdict .src{display:inline-block;margin-top:10px;font-size:12.5px;background:var(--cite-bg);color:var(--cite);padding:3px 9px;border-radius:3px;font-variant-numeric:tabular-nums}
.hintline{font-size:12.5px;color:var(--ink-soft);margin-top:18px}
kbd{font-family:inherit;background:#eef2f5;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:11.5px}

/* ---- result ---- */
.score{display:flex;align-items:baseline;gap:12px;margin:0 0 4px}
.score .num{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .den{font-size:17px;color:var(--ink-soft)}
.score .pct{margin-left:auto;font-size:17px;font-variant-numeric:tabular-nums}
.judge{font-size:14.5px;color:var(--ink-soft);margin:10px 0 22px}
.bychap{border-top:1px solid var(--line)}
.bychap div{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.bychap .n{flex:1}
.bychap .s{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.bychap .g{width:88px;height:6px;background:#e4e9ee;border-radius:3px;overflow:hidden;flex:none}
.bychap .g i{display:block;height:100%;background:var(--brand)}
.review{margin-top:10px}
.review details{border-bottom:1px solid var(--line);padding:12px 0}
.review summary{cursor:pointer;font-size:14.5px;font-weight:700;line-height:1.6}
.review summary::marker{color:var(--ng)}
.review .body{padding:12px 0 4px;font-size:14px;line-height:1.8}
.review .ans{margin:0 0 8px}
.review .ans b{color:var(--ok)}
.review .yours{color:var(--ng)}
footer{font-size:12px;color:var(--ink-soft);text-align:center;padding:28px 20px 0}
.hidden{display:none}
@media (max-width:560px){
  h1{font-size:20px}
  .panel{padding:18px}
  .qtext{font-size:16.5px}
  .btn{width:100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--cite);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>電力の小売営業に関する指針　理解度テスト</h1>
    <p>令和8年4月9日最終改定版に対応　全<span id="totalq">0</span>問／解説に指針の該当ページを表示</p>
  </div>
</header>

<div class="wrap">

  <!-- 設定 -->
  <section class="panel" id="setup">
    <h2>出題範囲を選ぶ</h2>
    <p class="note">章を選び、出題数と順序を決めて開始します。解答するとその場で正誤と解説が表示されます。</p>

    <fieldset>
      <legend>章</legend>
      <div class="chapters" id="chapters"></div>
      <div class="mini-actions">
        <button type="button" class="linkish" id="selAll">すべて選ぶ</button>
        <button type="button" class="linkish" id="selNone">すべて外す</button>
      </div>
    </fieldset>

    <div class="row">
      <label class="field"><span>出題数</span>
        <select id="numq">
          <option value="10">10問</option>
          <option value="20" selected>20問</option>
          <option value="30">30問</option>
          <option value="50">50問</option>
          <option value="0">選んだ章のすべて</option>
        </select>
      </label>
      <label class="field"><span>出題順</span>
        <select id="order">
          <option value="random" selected>ランダム</option>
          <option value="seq">指針の掲載順</option>
        </select>
      </label>
    </div>

    <p class="note" id="poolinfo"></p>
    <div class="actions"><button class="btn" id="start">テストを開始</button></div>
  </section>

  <!-- 出題 -->
  <section id="quiz" class="hidden">
    <div class="status">
      <span class="count"><b id="qnum">1</b> / <span id="qtotal">20</span>問</span>
      <span class="count">正答 <b id="hit">0</b></span>
    </div>
    <div class="bar"><i id="prog" style="width:0%"></i></div>

    <div class="panel">
      <div class="tags"><span class="tag" id="tagchap"></span><span class="tag cite" id="tagpage"></span></div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div id="verdict"></div>
      <div class="actions" id="qactions"></div>
      <p class="hintline"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> で解答、<kbd>Enter</kbd> で次へ進めます。</p>
    </div>
    <div class="actions"><button class="btn ghost" id="quit">中断して設定に戻る</button></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <div class="panel">
      <h2>結果</h2>
      <div class="score"><span class="num" id="rnum">0</span><span class="den">/ <span id="rden">0</span>問正解</span><span class="pct" id="rpct"></span></div>
      <p class="judge" id="rjudge"></p>
      <div class="bychap" id="bychap"></div>
      <div class="actions" style="margin-top:22px">
        <button class="btn" id="retryWrong">間違えた問題だけ解き直す</button>
        <button class="btn ghost" id="again">設定に戻る</button>
      </div>
    </div>
    <div class="panel review" id="reviewPanel">
      <h2>間違えた問題の復習</h2>
      <p class="note">見出しをクリックすると正解と解説が開きます。</p>
      <div id="review"></div>
    </div>
  </section>

  <footer>出典：経済産業省「電力の小売営業に関する指針」（平成28年1月制定／令和8年4月9日最終改定）。解説中のページ番号は同指針本文のページです。</footer>
</div>

<script>
const DATA = {"chapters":[{"id":1,"name":"序・用語の定義","range":"p.1〜3"},{"id":2,"name":"一般的な情報提供","range":"p.4〜8"},{"id":3,"name":"説明義務・書面交付（本編）","range":"p.8〜15"},{"id":4,"name":"電源構成・非化石証書の開示","range":"p.16〜35"},{"id":5,"name":"営業・契約形態の適正化","range":"p.36〜45"},{"id":6,"name":"契約内容の適正化","range":"p.46〜47"},{"id":7,"name":"苦情・問合せ／停電対応","range":"p.48〜49"},{"id":8,"name":"解除等手続・休廃止","range":"p.50〜57"},{"id":9,"name":"参考：説明義務・書面交付の解説","range":"p.58〜69"},{"id":10,"name":"料金高騰リスク対応の参考事例","range":"p.70〜73"}],"questions":[{"c":1,"p":"p.2","q":"本指針を遵守すべき主たる関係事業者として正しいものはどれか。","o":["一般送配電事業者を含む全ての電気事業者","小売電気事業者のみ","発電事業者及び小売電気事業者","小売電気事業者及びその媒介・取次・代理業者（登録特定送配電事業者及びその媒介等業者も同様に遵守が求められる）"],"a":3,"e":"主たる関係事業者は小売電気事業者及びその媒介・取次・代理業者。登録特定送配電事業者等は本指針に記載はないが同様に遵守が求められる。なお4（2）及び5には一般送配電事業者・配電事業者が遵守すべきルールも記載されている。"},{"c":1,"p":"p.3","q":"本指針における「解除等」の定義として正しいものはどれか。","o":["契約の解除のみ","契約の解除又は解約","契約の解除若しくは解約すること又は更新を行わないこと","契約の解除、解約、更新拒否及び契約内容の変更"],"a":2,"e":"「解除等」＝契約の解除若しくは解約すること又は更新を行わないこと。更新拒否が含まれる点が実務上のポイント。"},{"c":1,"p":"p.2 脚注3","q":"本指針の「違約金等」に関する記述として正しいものはどれか。","o":["小売供給契約の変更・解約に伴い発生する電気用品のリース契約等、別個の契約に係る違約金・精算金その他の需要家負担も含む","小売供給契約そのものに定められた違約金のみを指す","事務手数料は一切含まれない","小売電気事業者からの申出による解除に伴う負担も含む"],"a":0,"e":"需要家からの申出による変更・解除等に伴う違約金その他需要家の負担となるものをいい、リース契約等の別個の契約に係る違約金・精算金等の負担も含む。"},{"c":1,"p":"p.3","q":"本指針における「電源構成」の定義として正しいものはどれか。","o":["小売電気事業者が小売供給を行うために発電・調達する電気の電力量に係る電源種の構成","小売電気事業者が保有する発電設備の設備容量の構成","供給区域内の全発電所の発電実績の構成","非化石証書の使用量に基づく非化石電源比率"],"a":0,"e":"電源構成は「発電・調達する電気の電力量に係る電源種の構成」。非化石電源比率は電源構成ではなく非化石証書の使用量に基づき定まる点と区別する（p.18）。"},{"c":1,"p":"p.2","q":"「業務改善勧告」を行う主体として正しいものはどれか。","o":["電力・ガス取引監視等委員会","消費者庁長官","経済産業大臣","資源エネルギー庁長官"],"a":0,"e":"業務改善勧告は電気事業法第66条の12第1項に基づく電力・ガス取引監視等委員会の勧告。業務改善命令は経済産業大臣（法第2条の17等）が行う。"},{"c":1,"p":"p.1","q":"第2弾の改正電気事業法の施行により、低圧部門を含めて電気の小売業への参入が全面自由化された日はいつか。","o":["平成25年4月2日","平成28年1月1日","平成28年4月1日","平成27年12月1日"],"a":2,"e":"平成28年4月1日に第2弾の改正電気事業法が施行され、従来は特別高圧・高圧部門のみであった小売自由化が低圧部門を含め全面自由化された。"},{"c":2,"p":"p.4","q":"料金請求の根拠となる使用電力量等の情報の取扱いに関する記述として正しいものはどれか。","o":["請求書への記載が唯一の方法であり、ウェブサイトでの閲覧提供は認められない","需要家から請求があった場合にのみ示せば足りる","請求書への記載やウェブサイトでの閲覧を可能とすること等の方法により需要家に示さないことは問題となる","取次業者が示さない場合は、小売電気事業者の責任が問われることはない"],"a":2,"e":"需要家が自ら使用電力量を把握することは困難であるため、請求書記載やウェブ閲覧等の方法で示さないことは問題となる。取次業者の行為でも小売電気事業者の指導・監督が適切でなければ小売電気事業者自身の行為が問題となる。"},{"c":2,"p":"p.4","q":"需要家の誤解を招く情報提供として、指針が明示的に例示している表現はどれか。","o":["当社は24時間受付体制を整えています","当社の電気は停電しにくい","当社は業界最安値水準を目指しています","当社は地球温暖化対策に積極的に取り組んでいる"],"a":1,"e":"「当社の電気は停電しにくい」など需要家の誤解を招く情報提供により自己のサービスに誘導しようとすることは問題となる。"},{"c":2,"p":"p.4〜5","q":"標準メニューの公表に関する記述として正しいものはどれか。","o":["標準メニューは各小売電気事業者につき1つに限られる","標準メニューを公表した場合、公表メニュー以外の供給条件による販売は認められない","標準メニューの公表は高圧・特別高圧需要家向けの制度である","標準メニューは各社1つに限られず、公表後も期間限定の割引料金など公表メニュー以外の供給条件による販売も許容される"],"a":3,"e":"標準メニューは低圧需要家向けの定型的メニューを広く一般に公表するもので、各社1つに限られない。公表後も期間限定割引等、公表メニュー以外の供給条件による販売は許容される。"},{"c":2,"p":"p.5","q":"平均的な月額料金例の公表について、指針が望ましいとしている対象はどれか。","o":["過去3年間の実績平均単価を公表すること","高圧需要家向けに平均的な契約電力における月額料金例を公表すること","全需要家の平均使用量に基づく年間料金例を公表すること","低圧需要家向けに平均的な電力使用量における月額料金例を公表すること"],"a":3,"e":"低圧需要家向けに平均的な電力使用量における月額料金例を公表することが、需要家が料金水準の適切性を判断することに資するため望ましいとされる。"},{"c":2,"p":"p.5","q":"価格比較サイト等における第三者による問題となり得る情報提供について、正しい記述はどれか。","o":["第三者の情報提供であるため、小売電気事業者が対応する必要は一切ない","把握した場合には速やかに訂正を働きかけることが望ましく、特に自らの広告媒体として用いているサイトで長期間不当に放置し働きかけを行わない場合は問題となる","自社サイト以外については把握しても対応不要である","訂正の働きかけは法律上の義務であり、怠れば直ちに罰則の対象となる"],"a":1,"e":"訂正の働きかけは望ましい行為だが、自らの広告媒体として用いている媒体で虚偽・誤解を招く情報を把握しながら長期間不当に放置する場合は問題となる。"},{"c":2,"p":"p.5","q":"託送供給等約款に基づき支払った電気計器及び工事に関する費用負担を電気料金に含めて回収する場合の取扱いとして正しいものはどれか。","o":["内訳の記載は法令上の義務であり、違反は罰則の対象となる","内訳は契約締結前交付書面にのみ記載すれば足りる","当該費用を電気料金に含めて回収すること自体が問題となる","請求書・領収書等に当該工事費等の相当額を記載することが望ましい"],"a":3,"e":"電気料金の透明性確保の観点から、請求書・領収書等に工事費等の相当額を記載することが望ましい（望ましい行為）。"},{"c":2,"p":"p.6","q":"配電事業者により託送供給が行われ、その託送料金が一般送配電事業者と異なる場合の請求書等における託送料金相当額の記載方法として、指針が例示しているものはどれか。","o":["配電事業者の託送料金のみを記載し、注釈は付さない","託送料金相当額の記載を省略する","一般送配電事業者の託送料金相当額を記載したうえで、注釈等により当該配電事業者の供給区域や託送料金単価が分かるウェブサイトのアドレス等を記載する","両者の平均額を記載する"],"a":2,"e":"一般送配電事業者の託送料金相当額を記載したうえで、注釈等で配電事業者の供給区域や託送料金単価が分かるウェブサイトのアドレス等を記載する方法が例示されている。"},{"c":2,"p":"p.6","q":"小売電気事業者が経済産業大臣から業務改善命令を受けた場合の取扱いとして、指針が望ましいとしているものはどれか。","o":["国が公表するため事業者側の対応は不要である","需要家から問合せがあった場合にのみ回答する","契約締結前交付書面に必ず記載する","小売電気事業者自身がその事実を公表する"],"a":3,"e":"需要家が当該事実を把握できるようにすることが需要家保護の観点から適当であるため、小売電気事業者自身がその事実を公表することが望ましい。"},{"c":2,"p":"p.6","q":"市場連動型料金メニューにより小売供給を行う際の望ましい取組として、指針が明示しているものはどれか。","o":["ホームページのトップ画面から情報提供ページにワンクリックでアクセスできるようにすること","適用単価は請求書での事後通知のみとすること","市場価格高騰時には情報提供を控え、需要家の不安を煽らないこと","過去の単価推移は開示しないこと"],"a":0,"e":"適用単価を確認できる仕組みの導入や単価推移の分かりやすい掲示に加え、ホームページではトップ画面からワンクリックでアクセスできるようにすることが望ましい。市場価格高騰時にはより積極的な情報提供が望ましい。"},{"c":2,"p":"p.6〜7","q":"燃料費調整等の仕組みを伴う料金メニューによる小売供給を行う際の望ましい取組はどれか。","o":["燃料費調整単価の推移は企業秘密として非開示とすること","ホームページのトップ画面からワンクリックでアクセスでき、他の料金メニューと比較してたどりつきやすさに遜色がないようにすること","燃料費調整の仕組みは契約締結時にのみ説明し、以後は開示しないこと","調整単価は毎月の請求書のみで示すこと"],"a":1,"e":"仕組みや料金変動リスク、燃料費調整単価の推移をホームページ等で分かりやすく提供し、トップ画面からワンクリック、かつ他メニューと比較してたどりつきやすさに遜色がないことが望ましい。"},{"c":2,"p":"p.7","q":"調整上限を設けた燃料費調整等の仕組みを伴う料金メニューによる小売供給を行う場合、望ましいとされる対応はどれか。","o":["調整上限の存在は契約締結後に説明すれば足りる","調整上限の算定方法（算定に用いる基準価格を含む）や更新の条件等の考え方を供給約款等に定め、ホームページ等で分かりやすく情報提供する","調整上限は毎月見直し、需要家への通知は不要とする","調整上限は社内基準として管理すれば足り、外部に定める必要はない"],"a":1,"e":"調整上限の算定方法（基準価格を含む）や更新条件等の考え方を供給約款等に定めるとともに、ホームページ等で分かりやすく情報提供することが望ましい。"},{"c":2,"p":"p.7","q":"財務状況等に関する情報提供について、指針の記述として正しいものはどれか。","o":["財務情報は開示義務があり、開示しないことは直ちに問題となる","バランシンググループに関する情報は一切開示すべきでない","需要家の誤解を生むような形での提供も、事実に基づく限り問題とならない","需要家から要望があった場合には、合理的な範囲で、調達コスト変動への対応方針・取組（リスクヘッジ割合等の定量的情報を含む）や需要バランシンググループに関する情報を提供することが望ましい"],"a":3,"e":"公表情報を可能な範囲で分かりやすく提供することが望ましく、要望があれば合理的な範囲でリスクヘッジ割合等やBG（需給管理の実施者、インバランス料金の負担者等）の情報提供も望ましい。ただし誤解を生む形での提供は問題となる。"},{"c":2,"p":"p.8","q":"障害のある者への情報提供について、参考にすることが適切とされている指針はどれか。","o":["電気設備技術基準の解釈","消費者基本計画","障害者差別解消法に基づく「経済産業省所管事業分野における障害を理由とする差別の解消の推進に関する対応指針」","電力・ガス取引監視等委員会の業務規程"],"a":2,"e":"令和5年経済産業省告示第168号（経済産業省対応指針）を参考に対応することが適切とされ、音声読み上げソフト対応など障害者が利用しやすい方法が望ましいとされる。"},{"c":3,"p":"p.8","q":"供給条件の説明義務及び書面交付義務の根拠条文の組合せとして正しいものはどれか。","o":["説明義務＝法第2条の14／締結前書面＝法第2条の15／締結後書面＝法第2条の16","説明義務＝法第2条の15／締結前書面＝法第2条の13／締結後書面＝法第2条の17","説明義務＝法第2条の12／締結前書面＝法第2条の13／締結後書面＝法第2条の14","説明義務＝法第2条の13第1項／締結前書面＝法第2条の13第2項及び第3項／締結後書面＝法第2条の14"],"a":3,"e":"説明義務は法第2条の13第1項、契約締結前交付書面は同条第2項・第3項、契約締結後交付書面は法第2条の14に基づく。"},{"c":3,"p":"p.8〜9","q":"施行規則第3条の12第6項が求める説明の方法・程度に関する基準として正しいものはどれか。","o":["説明時間を30分以上確保すること","需要家の知識、経験及び小売供給契約を締結する目的に照らして、需要家に理解されるために必要な方法及び程度によること","全需要家に対して一律の内容・方法で説明すること","対面での説明を原則とすること"],"a":1,"e":"説明は需要家の知識、経験及び契約を締結する目的に照らして、理解されるために必要な方法及び程度によらなければならない。"},{"c":3,"p":"p.9","q":"電気と他の商品・役務のセット販売を行う場合の料金表示について正しいものはどれか。","o":["電気料金の額の算出方法は明示が必要だが、セット割引等の電気料金への配分金額まで明示する必要はない","いずれも明示は不要である","電気料金の額の算出方法もセット割引の電気料金への配分金額も、いずれも明示が必要である","電気料金の額の算出方法は明示不要だが、セット割引の配分金額は明示が必要である"],"a":0,"e":"電気料金の額の算出方法は明示が必要。一方、セット割引等の電気料金への配分金額を常に明示させると自由な商品開発の妨げとなるため、明示までは必要ない。"},{"c":3,"p":"p.9 脚注9","q":"セット販売を行う小売電気事業者が電気関係報告規則に基づき定期的に行う報告（電力取引報）における取扱いとして正しいものはどれか。","o":["割引額は全額を他の商品・役務側に計上して報告する","電気料金とそれ以外の商品・役務提供の対価に割引額を振り分けた上で、電気料金の売上高を報告する","セット販売分は報告対象外である","セット割引後の合計額を電気料金の売上高として報告する"],"a":1,"e":"電力取引報では販売電力量・販売額・契約口数等の報告義務があり、割引額を電気とそれ以外に振り分けた上で電気料金の売上高を報告する必要がある。"},{"c":3,"p":"p.10","q":"セット販売時に求められる説明・書面記載として、指針が挙げていないものはどれか。","o":["セット販売される商品・役務と電気の小売供給とで契約先が異なるときはその旨を適切に説明すること","キャッシュバック等を行うときは、誰が責任を持ってどのような手続で行うのかを明示すること","セット販売される他の商品・役務の原価構成を開示すること","どのような条件で料金割引等が適用されるのかを分かりやすく説明すること"],"a":2,"e":"（ア）契約先が異なる旨、（イ）割引の適用条件、（ウ）キャッシュバックの責任主体と手続、（エ）これらの契約締結前・締結後交付書面への記載が求められる。原価構成の開示は求められていない。"},{"c":3,"p":"p.11","q":"市場連動型料金メニューや燃料費調整等の仕組みを伴う料金メニューの説明について、説明義務違反となる行為はどれか。","o":["メリット（料金が安くなること等）のみを告げ、デメリット（料金が高くなる可能性があること等）を告げないこと","上限の有無について書面に記載すること","料金が変動する旨、変動額の算出方法及び上限の有無を説明すること","過去の変動事例をグラフを用いて説明すること"],"a":0,"e":"メリットのみを告げデメリットを告げないことは、需要家の誤認に基づく選択を招くもので説明義務違反となる（施行規則第3条の12第1項第8号関係）。"},{"c":3,"p":"p.11","q":"需要家が燃料費調整額等に上限設定がある料金メニューを明示的に希望し、それに合致したメニューがある場合の取扱いとして正しいものはどれか。","o":["当該メニューについて説明しないことは説明義務違反となる","上限なしメニューを優先して案内すべきである","事業者の営業方針により説明しないことも許容される","需要家が再度要望するまで説明する必要はない"],"a":0,"e":"需要家が明示的に希望し、合致するメニューがあるにもかかわらず当該メニューを説明しないことは、需要家の誤認に基づく選択を招き説明義務に違反する。"},{"c":3,"p":"p.11","q":"需要家の属性（高齢者、未成年者、障害者等）の把握について、指針の記述として正しいものはどれか。","o":["訪問販売の場合のみ属性把握が不要である","属性の把握は法令上の義務であり、違反は罰則の対象となる","需要家が郵便、電話、ホームページ等を通じて能動的に申し込む契約については、特段の事情がない限り属性の把握・判断について特段の措置を講ずる必要はない","いかなる場合も属性把握のための特段の措置を講じなければならない"],"a":2,"e":"需要家が能動的に申し込む場合は、特段の事情のない限り属性の把握・判断について特段の措置を講ずる必要はないとされている。"},{"c":3,"p":"p.11〜12","q":"需要家が新たな需要場所に入居する際の対応として正しいものはどれか。","o":["使用開始後に申込みがあった場合でも、電気の使用を開始した日まで契約の効力を遡らせ無契約状態とならないようにすることが望まれる","使用開始後の申込みは契約締結日からの効力とするのが原則である","需要家が無契約状態で使用している事実を知りつつ使用開始日を偽ることを助長する行為も、需要家の利便のためであれば許容される","入居前の契約締結は不要である"],"a":0,"e":"電気の使用開始日まで効力を遡らせ無契約状態を避けることが望まれる。使用開始日を偽ることを助長する行為は電気事業の健全な発達に支障が生じるおそれがあり問題となる。"},{"c":3,"p":"p.12","q":"クーリング・オフ等により無契約状態で電気を使用している需要家から申込みを受けた小売電気事業者等が説明することが望ましい内容はどれか。","o":["無契約期間の電気料金は請求されない旨","無契約状態の期間について、自己との契約の効力を遡らせるか、最終保障供給（経過措置期間中の低圧は特定小売供給）を受けたとするかのどちらかを選択する必要がある旨","供給停止までは特段の手続が不要である旨","無契約状態は一般送配電事業者が自動的に解消する旨"],"a":1,"e":"無契約状態での使用を解消するには、契約の効力を遡らせるか最終保障供給を受けたとするかの選択が必要である旨を説明することその他必要な情報提供が望ましい。"},{"c":3,"p":"p.13","q":"スイッチングの際の説明について、望ましい行為として指針が挙げているものはどれか。","o":["一般送配電事業者が違約金の有無を需要家に通知すること","切替え前の小売電気事業者が、切替え後の事業者の料金水準を説明すること","切替え後の小売電気事業者が、旧契約の解除手続を需要家に代わって行うこと","切替え後の小売電気事業者が、旧小売供給契約の解除等が必要となること及び解除等の条件によっては違約金等の負担が生じる可能性があることを説明すること"],"a":3,"e":"切替え後の小売電気事業者が供給条件の説明の際に、旧契約の解除等の必要性と違約金等の発生可能性を説明することが望ましい。オール電化等でエネルギー源を切り替える場合は、既存設備の撤去や一定期間前の解除通知が必要となる可能性も説明することが望ましい。"},{"c":3,"p":"p.13","q":"市場連動型料金メニューの契約締結等をする際の情報提供について、望ましいとされる方法はどれか。","o":["上限の有無は契約締結後に説明すること","過去の変動事例は不安を与えるため示さないこと","算出に用いる係数の考え方は企業秘密として説明しないこと","市場価格が大きく変動した過去の事例を用い、具体的な変動の額をグラフを用いて示すなどして分かりやすく説明すること"],"a":3,"e":"料金の算出方法や係数の考え方、市場価格変動と料金変動の関係をグラフ等で分かりやすく説明し、過去の大きな変動事例を用いて具体的な変動額を示すことが望ましい。料金や変動額の上限を撤廃する変更の説明時も同様。"},{"c":3,"p":"p.15","q":"電気と他の継続的サービスをセット販売する場合の契約期間の設定について、望ましいとされる対応はどれか。","o":["各契約の契約期間を同じ期間に設定することや、各契約のうち最も長期の契約期間の満了時には複数の契約を違約金等の負担なく同時に解除等できるようにすること","各契約の契約期間を意図的にずらし、需要家の解約時期を分散させること","違約金条項を設けないこと","セット販売では自動更新条項を必ず設けること"],"a":0,"e":"契約期間が個別に設定されていると同時解除の際に常に違約金等が発生し、スイッチングを事実上抑制する効果があるため、期間を揃えるか最長契約期間の満了時に違約金負担なく同時解除できるようにすることが望ましい。"},{"c":4,"p":"p.17","q":"指針の整理表において、FIT電気を調達し「再エネ指定なし」の非FIT非化石証書を必要量使用した場合の訴求として正しいものはどれか。","o":["「実質再エネ」と訴求できる","環境価値の訴求は一切できない","「CO2ゼロエミ」と訴求できる","「再エネ＋CO2ゼロエミ」と訴求できる"],"a":2,"e":"整理表のとおり、FIT電気に再エネ指定なしの非FIT非化石証書を割り当てCO2排出量がゼロとなるよう調整した場合は「CO2ゼロエミ」となる。再エネとしての訴求にはFIT非化石証書又は再エネ指定の非FIT非化石証書が必要。"},{"c":4,"p":"p.17 ※5","q":"非化石証書以外の証書やクレジット等を用いた場合の訴求について正しいものはどれか。","o":["販売する電気そのものについては環境価値を訴求できないが、電気の購入に伴って当該証書等の価値が需要家にもたらされる場合は、電気そのものの環境価値ではない旨を明示した上で当該価値を訴求することは妨げられない","いかなる訴求も認められない","販売する電気そのものの環境価値として訴求できる","「グリーン電力」の用語であれば使用できる"],"a":0,"e":"非化石証書以外の証書等では電気そのものの環境価値は訴求できない。ただし電気そのものの価値ではない旨を明示すれば当該証書等の価値の訴求は妨げられない。また「グリーン電力」「クリーン電力」「きれいな電気」等の用語を個別メニューや電源構成の説明に用いることは環境価値の訴求に当たる。"},{"c":4,"p":"p.18","q":"電源構成等を開示する場合（小売供給の特性とする場合を除く）の算定期間として望ましいものはどれか。","o":["当年度の月別実績値のみ","過去3年度の平均値","前年度実績値（確定前は前々年度実績値）又は当年度計画値","直近12か月の移動平均値"],"a":2,"e":"前年度実績値（前年度実績値が確定する前は前々年度実績値）又は当年度計画値として算定することが望ましい。"},{"c":4,"p":"p.18","q":"実績値がない新規参入の小売電気事業者の電源構成の開示について、指針の記述として正しいものはどれか。","o":["実績が出るまで一切開示できない","供給開始後数ヶ月間の直近実績値をもって開示することもあり得る","前年度の業界平均値を用いる","一般送配電事業者の公表値を代用する"],"a":1,"e":"実績値がない新規参入事業者の場合には、供給開始後数ヶ月間の直近実績値をもって開示することもあり得るとされている。"},{"c":4,"p":"p.18〜19","q":"「小売供給の特性とする場合」の意味として正しいものはどれか。","o":["電源構成を任意開示している場合をすべて含む","自社発電所を保有している場合をいう","ある特性が小売供給の供給条件とされている場合をいい、電源特定メニューや非化石証書の使用による環境価値を約したメニューが該当する","広告で電源に言及したすべての場合をいう"],"a":2,"e":"「小売供給の特性とする場合」＝ある特性が供給条件とされている場合。水力100%等の電源特定メニューのほか、特定電源比率が一定水準以上であることを供給条件とするメニュー、再エネを一定割合以上含むメニュー等が該当する。"},{"c":4,"p":"p.19","q":"電源構成等を月単位など年度単位以外で示す場合の取扱いとして正しいものはどれか。","o":["月単位の表示は小売供給の特性とする場合のみ認められる","月単位のみの表示が望ましい","年度単位以外の情報を示すことは認められない","年度単位以外の情報を示すことは否定されないが、誤解を招かないよう年度単位の情報を併記することが望ましい"],"a":3,"e":"年度単位以外（月単位など）を示すことは否定されないが、誤解を招かないよう年度単位の情報を併記することが望ましい。"},{"c":4,"p":"p.19","q":"一般送配電事業者又は配電事業者から補給を受けているインバランス供給の電源構成への仕分けについて正しいものはどれか。","o":["仕分けは不要である","常に「卸電力取引所」に区分する","当該一般送配電事業者等が公表するインバランス供給に係る電源構成の数値を織り込んで算定することが望ましく、当該数値が公表されていない場合は「その他」へ分類する","常に「その他」に区分する"],"a":2,"e":"公表される電源構成の数値を織り込んで算定することが望ましく、公表されていない場合に「その他」へ分類する。"},{"c":4,"p":"p.19","q":"計画値同時同量を採用している場合の発電事業者側のインバランス供給の算定方法として、望ましいとされているものはどれか。","o":["必ず「卸電力取引所」に計上する方法","発電事業者の前年度実績で按分する方法","必ず「その他」に計上する方法","卸売契約に基づき計画どおりの発電量が供給されたとみなして算定する方法、又は補給を行う一般送配電事業者等が公表するインバランス供給に係る電源構成の数値を織り込んで算定する方法のいずれか"],"a":3,"e":"いずれかの方法を採用することが望ましいとされている。"},{"c":4,"p":"p.20","q":"特定メニューの販売電力量を控除して電源構成を算定する場合の実績値・計画値の対応として正しいものはどれか。","o":["控除は当年度計画値による算定の場合のみ行う","各電源を前年度実績値で算定する場合でも、特定メニューは常に当年度計画値を用いる","実績値と計画値の対応関係は問われない","各電源の調達電力量を前年度実績値で算定する場合は特定メニューの販売電力量も前年度実績値を用いる。ただし特定メニューの前年度実績値が存在しない場合は、その旨を付記した上で当年度計画値を用いた控除も許容される"],"a":3,"e":"実績値ベースなら特定メニューも実績値、計画値ベースなら特定メニューも計画値を用いることが望ましい。実績値が存在しない場合は付記の上で計画値を用いた控除も許容される。"},{"c":4,"p":"p.21","q":"「地産地消」と訴求して電気を販売するために最低限満たす必要がある要件はどれか。","o":["特定の地域に本社を置く事業者が販売すること","主として特定の地域の発電所で発電した電気を、同一地域の需要家へ販売し、消費すること","再生可能エネルギー電源のみで供給すること","地域の自治体と協定を締結していること"],"a":1,"e":"「地産地消」は発電場所と供給場所の地域的同一性を前提とする概念であり、この要件を最低限満たす必要がある。"},{"c":4,"p":"p.21","q":"「地産地消」の「地域」の考え方について、指針の記述として正しいものはどれか。","o":["都道府県単位でなければ認められない","一定の限定された地域において発電し消費されることが基本であり、関東地方など一定の広い地域を特定して「地産地消」と訴求することは望ましいものではない","関東地方など一定の広い地域を特定して「地産地消」と訴求することも望ましい","市町村単位でなければ認められない"],"a":1,"e":"一定の限定された地域における発電・消費が基本であり、関東地方など広い地域を特定して「地産地消」と訴求することは望ましくない。"},{"c":4,"p":"p.23 及び脚注19","q":"水力発電による電気として表示するが、当該販売電力量に相当する非化石証書を使用していない場合に必要な注釈はどれか。","o":["注釈は不要である","再生可能エネルギー電源としての価値がないことと、CO2ゼロエミッション価値がないこと（火力発電による電気等も含めた全国平均のCO2排出量を持った電気として扱われること）の双方の注釈","再生可能エネルギー電源としての価値がない旨の注釈のみ","CO2ゼロエミッション価値がない旨の注釈のみ"],"a":1,"e":"再エネ電源の電源種を表示しながら非化石証書の使用がない場合は、再エネとしての価値がないこととCO2ゼロエミッション価値がないことの双方の注釈が必要。再エネ指定でない非化石証書を使用している場合は、再エネ電源としての価値がないことの注釈が必要となる。"},{"c":4,"p":"p.24","q":"非化石証書の使用と電源構成の関係について正しい記述はどれか。","o":["非化石証書が化体する非化石価値は電源構成そのものとは異なるため、非化石証書を使用しても小売電気事業者の電源構成には影響しない","非化石証書の使用量は電源構成の「その他」に計上する","非化石証書を使用した場合、電源構成の開示義務が免除される","非化石証書を使用すれば、その分だけ電源構成上も再生可能エネルギー電源として計上できる"],"a":0,"e":"非化石証書を使用しても電源構成には影響しない。再エネ電源によらない電気を調達しているのに証書使用を理由に「再生可能エネルギー電気100%」と表示することは問題となる。"},{"c":4,"p":"p.24","q":"再生可能エネルギー指定の非化石証書を使用した小売電気事業者が「実質的に、再生可能エネルギー電気●●％の調達を実現している」と訴求する場合の取扱いとして正しいものはどれか。","o":["注釈を巻末にまとめて記載すれば問題とならない","当該訴求と近接した箇所に電源構成の表示又は主な電源種の表示を分かりやすく行い、かつ非化石証書の使用によるという意味であることを明確に説明している限り、問題とならない","電源構成の表示は不要である","いかなる場合も問題となる"],"a":1,"e":"近接した箇所での電源構成又は主な電源種の分かりやすい表示と、証書の使用によるという意味の明確な説明があれば、誤認を招く表示には当たらず問題とならない。"},{"c":4,"p":"p.25 及び脚注24","q":"電気の質に関する説明のうち、指針上「問題となる行為には当たらない」とされている例はどれか。","o":["当社は、クリーンな電源で発電しており、地球温暖化対策に積極的に取り組んでいる","安定的に発電できる電源を用いているため周波数や電圧が安定している","当社の電源構成により、お届けする電気の品質が他社より優れている","クリーンな電源で発電しているためきれいな電気が届く"],"a":0,"e":"送配電網を経由する電気は物理的に混ざり全て均等の性質を有するため、電源構成が供給される電気の質と同様であるかのような説明は問題となる。ただし「クリーンな電源で発電しており地球温暖化対策に積極的に取り組んでいる」旨の説明は問題となる行為には当たらない。"},{"c":4,"p":"p.25〜26","q":"電源構成等の情報開示において問題となる行為として、指針が挙げているものはどれか。","o":["電源構成に加えて非化石証書の使用状況を開示すること","二酸化炭素排出係数を併記すること","割合等の具体的な数値を示さず、単にイメージ図を掲載する方法で開示すること","他者から調達した電気の仕分け方法を明示すること"],"a":2,"e":"合理的な根拠に基づく算定と具体的な数値の提示が必要であり、イメージ図の掲載のみでは問題となる。また他者から調達した電気は仕分け方法を明示するなど算定の具体的根拠を示す必要がある。"},{"c":4,"p":"p.26","q":"「水力電源○％以上を目指す」等の目標値の表示について、指針の記述として正しいものはどれか。","o":["目標値は小売供給の特性とする場合にのみ表示できる","調達計画と著しく異なるにもかかわらず、供給する電気の電源構成が当該目標値のとおりであると需要家を誤認させる場合には問題となる","目標値の表示は常に問題となる","目標値であることを明示すればいかなる内容でも問題とならない"],"a":1,"e":"調達計画と著しく異なり、電源構成が目標値のとおりであると需要家を誤認させる場合に問題となる。"},{"c":4,"p":"p.26","q":"小売電気事業者が、供給地域の電線路と電気的に接続されていない地域で発電された電気を供給する旨の表示を行うことについて正しいものはどれか。","o":["根拠を欠くものであり問題となる","注釈を付せば問題とならない","計画値に基づく限り問題とならない","非化石証書を使用していれば問題とならない"],"a":0,"e":"電気的に接続されていない地域で発電された電気を供給する旨の表示は根拠を欠くものであり問題となる。"},{"c":4,"p":"p.26 脚注25","q":"揚水発電の電源区分上の取扱いとして正しいものはどれか。","o":["開示対象外である","高度化法の非化石電源比率の算定上で除かれる部分は水力発電所の区分からは除き、揚水発電所の区分で開示する又は「その他」に含める等の対応が可能である","常に水力発電所（3万kW以上）の区分に含める","常に「卸電力取引所」に区分する"],"a":1,"e":"非化石電源比率の算定上除かれる部分は水力発電所の区分から除き、揚水発電所の区分での開示や「その他」への計上等の対応が可能。"},{"c":4,"p":"p.28","q":"常時バックアップにより調達した電気の電源構成の仕分け方法として正しいものはどれか。","o":["常に「その他」に区分する","資源エネルギー庁が集計している電力調査統計において公表される旧一般電気事業者の発電部門の電源種別の発電実績（当該事業者がウェブサイト等で電源構成を公表している場合は当該数値）に基づき仕分ける","調達先との契約で定めた任意の比率で仕分ける","常に「卸電力取引所」に区分する"],"a":1,"e":"電力調査統計で公表される旧一般電気事業者の発電部門の電源種別発電実績（当該事業者が電源構成を公表している場合はその数値）に基づき仕分ける必要があり、その旨の説明も示す必要がある。"},{"c":4,"p":"p.28","q":"卸売を受けている電気のうち、開示情報等によっても電源構成に仕分けることができないものの取扱いとして正しいものはどれか。","o":["開示自体を控えなければならない","必ず「卸電力取引所」に区分しなければならない","「日本卸電力取引所から調達した電気」に区分すべきものを除き、「その他」に区分しても問題とならない","調達先の推定値を用いて仕分けなければならない"],"a":2,"e":"仕分けができるものは仕分けが必要。仕分けできないものは、「日本卸電力取引所から調達した電気」に区分すべきものを除き「その他」に区分しても問題とならない。"},{"c":4,"p":"p.28〜29","q":"日本卸電力取引所から調達した電気の二酸化炭素排出係数の算出方法として、指針が求めるものはどれか。","o":["自社の調整後排出係数を用いる方法","ゼロとして扱う方法","全国平均の排出係数を用いる方法","取引所で約定された事業者の事業者別の基礎排出係数を、約定した電力量に応じて加重平均することにより算出する方法"],"a":3,"e":"約定事業者の事業者別基礎排出係数を約定電力量に応じて加重平均する方法以外で算出することは問題となる。また「卸電力取引所」区分にはどのような電気が含まれ得るのか（水力、火力、原子力、FIT電気、再生可能エネルギー等）を明示する必要がある。"},{"c":4,"p":"p.29","q":"異なる時点間で発電・調達した電力量を移転する取扱いについて、正しい記述はどれか。","o":["異なる時点間で電力量を移転する取扱いは問題となるが、発電・調達した電気を蓄電設備に蓄電し放電する場合は実際に充放電が行われているため、電力量が移転したとして算定することに問題はない","時点間移転は特定メニューに限り認められる","蓄電設備を用いた場合も時点間移転として問題となる","昼間に発電した電気を夜間に供給する電気とみなすことも、年間の総量が合っていれば問題ない"],"a":0,"e":"時点間移転は供給実態と著しく乖離し、時間帯による電気の価値の差を無視するため問題となる。ただし蓄電設備による充放電は実際に電気の移転が行われているため問題ない。"},{"c":4,"p":"p.30","q":"特定メニューを提供する小売電気事業者が、電源構成の開示に際して当該特定メニューの販売電力量や非化石証書使用量を控除せずに算定した電源構成を開示する場合の取扱いとして正しいものはどれか。","o":["特定メニューの需要家にのみ注釈を示せば足りる","注釈は不要である","特定メニューによる販売電力量や非化石証書使用量を含んだ情報であることに関する適切な注釈を付す必要があり、これを付さないことは問題となる","控除しない開示自体が禁止されている"],"a":2,"e":"控除しない場合は、特定メニュー分を含んだ数値である旨（全販売電力量と当該メニューによる販売電力量、対象年度等）の適切な注釈が必要。注釈を付さないことは特定メニュー以外の需要家の誤認を招き問題となる。"},{"c":4,"p":"p.30〜31","q":"FIT電気の「二酸化炭素を排出しない」という特性・メリットの帰属について正しいものはどれか。","o":["当該電気の供給を受けた特定の需要家に帰属する","非化石証書の購入分について購入者に帰属するほかは、費用を負担した全需要家に薄く広く帰属する","発電事業者に帰属する","国に帰属する"],"a":1,"e":"FIT電気の費用は賦課金と非化石証書の売却収入により賄われているため、非化石証書購入分は購入者に帰属し、それ以外は費用を負担した全需要家に薄く広く帰属する。"},{"c":4,"p":"p.31","q":"FIT電気を文字で表示・説明する場合の表記について正しいものはどれか。","o":["アルファベットで「FIT」と表示・説明することが求められ、片仮名の「フィット」という表示は割合やFIT制度の説明を付記していても問題となる","「固定価格買取電気」との表記が必須である","片仮名の「フィット」でも割合とFIT制度の説明を付記すれば問題とならない","表記方法に定めはない"],"a":0,"e":"需要家の混乱回避の観点から、アルファベットの「FIT」による表示・説明が求められ、これに反する表示・説明は問題となる。"},{"c":4,"p":"p.32","q":"電源構成等や非化石証書の使用による環境価値を小売供給の特性として供給する場合の算定期間について、正しいものはどれか。","o":["事業者が任意に定める期間でよい","常に前年度実績値を用いる","電気を供給する年度（当年4月1日から翌年3月31日まで）を単位とすることを基本とし、年度途中で販売を開始する場合は開始日から当該年度末日までとする","常に暦年を単位とする"],"a":2,"e":"将来の計画を示して説明すべきであり、計画の対象期間は年度単位が基本。年度途中に販売開始する場合は開始日から年度末日（3月31日）までとなる。"},{"c":4,"p":"p.32","q":"電源構成等や非化石証書の使用による環境価値を特性として供給する場合の事後対応として、指針が求めるものはどれか。","o":["販売時点では計画値となるため、事後的に計画値と実績値がどの程度整合しているかについて需要家に適切に説明することが必要である","実績値の説明は不要である","実績値は行政への報告のみで足りる","実績値の説明は需要家から請求があった場合のみ必要である"],"a":0,"e":"説明する電源構成等は販売年度単位であり販売時点では計画値となるため、事後的に計画値と実績値の整合について適切に説明することが必要。これを行わないことは問題となる。"},{"c":4,"p":"p.33 脚注31・32","q":"電源構成の表示に付す注釈の「近接した箇所の分かりやすい表示」について、指針の記述として正しいものはどれか。","o":["手に取って見る印刷物の場合、JIS Z8305に規定する8ポイント未満の文字では十分ではなく、注釈元の表示の大きさとのバランス等によってはこれより大きい文字とすることも必要となり得る","注釈は別ページへのリンクで示せば足りる","印刷物では6ポイント以上であれば足りる","ウェブページでは末尾にまとめて記載すれば足りる"],"a":0,"e":"注釈元の表示と同じ視野に入るなど対応関係が明瞭に認識できる箇所に記載する必要があり、印刷物では8ポイント未満では不十分。パソコンのホームページ表示ではスクロールを要しない箇所などをいう。"},{"c":4,"p":"p.17 ※1","q":"FIT電気について環境価値の整理上必要とされる3要件の組合せとして正しいものはどれか。","o":["「FIT電気」であること、FIT電気の割合、FIT制度の説明","「FIT電気」であること、買取期間、非化石証書の使用状況","FIT電気の割合、発電設備の設備容量、買取価格","「FIT電気」であること、発電所の立地地域、FIT制度の説明"],"a":0,"e":"①「FIT電気」であること、②FIT電気の割合、③FIT制度の説明の3要件が必要とされる（p.31の（ア）〜（ウ）と対応）。"},{"c":5,"p":"p.36","q":"受電実態がない者が需要家に代わり自らの名義で小売供給契約を締結し需要家に電気を提供する行為について、指針の記述として正しいものはどれか。","o":["高圧・特別高圧に限り許容される","マンション等の一括受電では常に許容される","需要家の同意があれば問題とならない","実態に則さない契約形態を生じさせるものであり電気事業法上許容されず、簡易・迅速なスイッチングができないなど需要家保護の観点からも許容し得ない"],"a":3,"e":"電気事業法上「需要」は物理的な実態のある電気の使用・受電を前提としており、受電実態のない者が名義人となる形態は許容されない。最終的な電気の使用者と供給元の間に契約関係がなく、簡易・迅速なスイッチングもできない。"},{"c":5,"p":"p.36","q":"小売電気事業の登録等を受けていない者が需要家に代わり契約名義人となり、最終的な電気の使用者に電気を提供した場合の罰則として正しいものはどれか。","o":["100万円以下の罰金のみ","300万円以下の罰金","30万円以下の罰金","1年以下の懲役若しくは100万円以下の罰金又はこれらの併科"],"a":3,"e":"電気事業法第2条の2に違反する無登録営業として、法第117条の2第1号により1年以下の懲役若しくは100万円以下の罰金又はこれらの併科の対象となり得る。"},{"c":5,"p":"p.37","q":"既自由化部門において既に締結されている「問題となる既存契約」の取扱いとして正しいものはどれか。","o":["即時の契約変更が一律に求められる","契約期間満了時（期間が長期間残っている場合は契約満了を待たず平成31年1月目途）に契約関係の是正を求めることとされ、期間延長・更新等は許容されない","契約期間が満了するまでは延長・更新も許容される","需要家が早期是正を希望しても契約期間満了まで対応する必要はない"],"a":1,"e":"需要家への影響に配慮しつつ、契約期間満了時（長期間残る場合は平成31年1月目途）に是正を求め、報告徴収等で状況を確認する。期間延長・更新等は許容されず、需要家が早期是正を希望する場合は速やかに応じることが求められる。"},{"c":5,"p":"p.37","q":"実際の電気の使用者と異なる者が契約者となる場合の「一定の特別な関係」について、明らかに認められない例として指針が挙げているものはどれか。","o":["自己の会員であることを理由として、それ以上の関係の無い者の自宅の契約者となる場合","親子関係にある場合","親子会社関係にある場合","電気料金を実質的に負担している場合"],"a":0,"e":"自己の会員であることのみを理由とする場合や、取引先であることのみを理由として事業所の契約者となる場合は、一定の特別な関係が明らかに認められない例とされている。"},{"c":5,"p":"p.38","q":"「媒介」「取次ぎ」「代理」の定義に関する記述として正しいものはどれか。","o":["取次ぎでは、小売供給契約は小売電気事業者と需要家の間で締結される","代理とは、他人（小売電気事業者）の名をもって、当該他人のためにすることを示して行う意思表示をいう","媒介とは、自己の名をもって他人の計算において法律行為をすることを引き受ける行為をいう","取次ぎとは、他人の間に立って当該他人を当事者とする法律行為の成立に尽力する事実行為をいう"],"a":1,"e":"媒介＝成立に尽力する事実行為、取次ぎ＝自己の名をもって他人の計算において法律行為を引き受ける行為、代理＝他人の名をもって当該他人のためにすることを示して行う意思表示。取次ぎでは小売供給契約は需要家と取次業者の間で締結される（p.41）。"},{"c":5,"p":"p.38","q":"媒介・取次・代理業者の義務に関する記述として正しいものはどれか。","o":["小売電気事業のライセンスを有しないため、説明義務・書面交付義務は負わない","説明義務は負うが書面交付義務は負わない","小売電気事業者が代わりに説明すれば義務を免れる","需要家に対して説明義務及び契約締結前・締結後の書面交付義務を負う"],"a":3,"e":"媒介等を行う場合、媒介・取次・代理業者は電気事業法第2条の13及び第2条の14に基づき需要家に対して説明義務及び契約締結前・締結後の書面交付義務を負う。"},{"c":5,"p":"p.40","q":"「〇〇」というブランド名を有するA社が、B電力の代理店や取次店として営業活動を行う場合の広告表示について、許容されないものはどれか。","o":["〇〇電気（powered by B電力）","〇〇電気（A社の電気を供給します）","〇〇電気（B電力の電気を供給します）","〇〇電気"],"a":1,"e":"A社は代理店等であり電気の供給を行わないため、「A社の電気を供給します」は虚偽の営業活動にあたり許容されない。単なるブランド名表示やB電力の供給である旨の表示は原則として許容されるが、説明義務の充足は営業活動も勘案して総合的に判断される。"},{"c":5,"p":"p.41","q":"取次ぎを行う際に遵守すべき事項として正しいものはどれか。","o":["託送供給契約の締結主体は当事者の合意で自由に定められる","託送供給契約は小売電気事業者が一般送配電事業者又は配電事業者との間で締結する","託送供給契約は取次業者が一般送配電事業者又は配電事業者との間で締結する","託送供給契約は需要家が締結する"],"a":1,"e":"小売供給の主体は小売電気事業者であるため、託送供給契約は小売電気事業者が一般送配電事業者又は配電事業者との間で締結することが必要。"},{"c":5,"p":"p.41","q":"取次ぎに関する遵守事項として正しいものはどれか。","o":["順次取次ぎ及び需要家側の取次ぎを行わないことが必要である","取次ぎの再委託は小売電気事業者の承諾があれば認められる","取次業者がさらに他の者に取次ぎを委託する順次取次ぎは、契約で定めれば認められる","需要家側の取次ぎのみ認められる"],"a":0,"e":"順次取次ぎ（取次業者がさらに他の者に取次ぎを委託すること）及び需要家側の取次ぎを行わないことが必要とされる。"},{"c":5,"p":"p.41","q":"取次ぎにおける苦情等の処理義務の所在について正しいものはどれか。","o":["需要家との契約相手である取次業者のみが対応できる","小売電気事業者と取次業者が連帯して法律上の義務を負う","取次業者が電気事業法上の義務を負い、小売電気事業者は負わない","電気事業法第2条の15の苦情等の処理義務は小売電気事業者が負い、小売電気事業者が責任を負うことを前提に取次業者も苦情等の処理を行うことは妨げられない"],"a":3,"e":"供給能力の確保（法第2条の12第1項）や苦情等の処理（法第2条の15）等の小売電気事業者としての義務は小売電気事業者が負う。小売電気事業者が責任を負う前提で取次業者が苦情処理を行うことは妨げられない。"},{"c":5,"p":"p.41","q":"小売電気事業者が取次業者の債務不履行等を理由に取次契約を解除等する場合に求められる対応はどれか。","o":["需要家に対し速やかに供給停止を予告すること","特段の措置は不要である","需要家に不利益を負わせることのないよう措置すること（例えば従前と同等の小売供給契約を需要家と直接締結すること等）","一般送配電事業者に託送供給契約の名義変更を求めること"],"a":2,"e":"取次契約の解除等により需要家が不利益を受けないよう十分な需要家保護策をとることが必要で、従前と同等の契約を需要家と直接締結すること等が求められる。"},{"c":5,"p":"p.41〜42","q":"小売電気事業者になりすます詐称等のトラブル防止のため、望ましいとされている対応はどれか。","o":["自己のホームページのトップ画面等需要家が認識しやすい箇所に、資源エネルギー庁が公表している小売電気事業者の一覧へのリンクを掲載することや、業務提携している媒介・取次・代理業者の名称等を分かりやすく掲載すること","需要家に対し身分証の提示を求めること","訪問販売を全面的に取りやめること","媒介・取次・代理業者の利用を禁止すること"],"a":0,"e":"登録小売電気事業者一覧へのリンク掲載や提携している媒介・取次・代理業者の名称等の掲載が、詐称等のトラブル防止に資するため望ましいとされる。"},{"c":5,"p":"p.42","q":"高圧一括受電等における電気事業法上の位置づけとして正しいものはどれか。","o":["高圧一括受電事業者等は小売電気事業者として登録が必要である","高圧一括受電事業者等から各戸・各テナントへの電気の提供も小売供給として規制対象となる","受電実態を有する高圧一括受電事業者等から最終的な電気の使用者への電気の提供は、一の需要場所内での電気のやりとりとして規制対象外であり、当該高圧一括受電事業者等は電気事業法上の需要家と位置づけられる","マンション管理組合は高圧一括受電事業者等に含まれない"],"a":2,"e":"一の需要場所内でのやりとりは規制対象外であり、受電設備の所有や維持・管理を行う高圧一括受電事業者等（マンション管理組合を含む）は電気事業法上の需要家と位置づけられる。"},{"c":5,"p":"p.43","q":"高圧一括受電等における小売電気事業者の行為について、問題となるものはどれか。","o":["高圧一括受電事業者等と小売供給契約を締結すること","電気事業法上の需要家と位置付けられる高圧一括受電事業者等との関係において、本指針に定められた需要家保護策を適切に行わないこと","マンション管理組合から業務委託を受けること","高圧一括受電事業者等に保護措置の実施状況を確認すること"],"a":1,"e":"高圧一括受電事業者等との関係で需要家保護策を適切に行わないことは問題となる。また業務委託等により最終使用者への保護措置義務を負う場合にこれを適切に行わないことや、同一・密接関係性がある場合等に監督を行わず保護措置が行われなかった場合も問題となる。"},{"c":5,"p":"p.43","q":"高圧一括受電事業者等の望ましい行為として、指針が挙げているものはどれか。","o":["説明・書面交付は小売電気事業者が行うため不要であること","供給約款の写しを掲示すれば足りること","説明は管理組合の理事会に対して行えば足りること","最終的な電気の使用を希望する者から利用申込みを受けた場合に、小売電気事業者に求められるものと同等の説明・書面交付を行うこと。加えて導入決議のための住民説明会等でも十分な説明を行うこと"],"a":3,"e":"最終使用者保護の観点から保護措置を適切に行うことが望ましく、申込みを受けた場合の同等の説明・書面交付に加え、導入決議のための住民説明会等での十分な説明も望ましいとされる。"},{"c":5,"p":"p.43〜44","q":"需要家代理モデルに関する記述として正しいものはどれか。","o":["代理事業者を他のサービスとセットで提供することは許容されない","代理事業者は小売電気事業の登録が必要である","小売供給契約の主体は小売電気事業者と当該需要家であり、電気事業法上の規制の対象外だが、代理事業者が小売電気事業者に求められるものと同等の説明・書面交付を需要家に対し適切に行うことが望ましい","代理事業者が小売供給契約の当事者となる"],"a":2,"e":"代理事業者はあくまで需要家の代理であり、契約主体は小売電気事業者と需要家。規制対象外だが同等の説明・書面交付が望ましい。代理サービスを通信など他のサービスとセットで提供することも許容される。"},{"c":5,"p":"p.44","q":"小売電気事業者が業務委託を行う場合に、電気事業法上必要とされる事項の組合せとして正しいものはどれか。","o":["①小売電気事業者が電気の供給を行うこと、②受託者が託送供給契約を締結すること","①受託者が需要家に対して電気の供給を行うこと、②小売電気事業者が託送供給契約を締結すること","①②いずれも受託者が行うことができる","①小売電気事業者が自ら需要家に対して電気の供給を行うこと、②小売電気事業者が自ら一般送配電事業者又は配電事業者等と託送供給契約を締結すること"],"a":3,"e":"供給能力の確保や苦情対応、計画値同時同量対応等の業務委託は許容されるが、①自ら小売供給を行うこと、②自ら託送供給契約を締結することが必要で、これらの主体を他の者に変更する行為は問題となる。"},{"c":5,"p":"p.45","q":"小売電気事業者間でバランシンググループを組む場合の取扱いとして正しいものはどれか。","o":["託送供給契約の締結主体要件を満たさなくなるため認められない","複数者名義の託送供給契約を締結することとなるため託送供給契約の締結要件は満たされ、代表契約者等に計画値同時同量対応事務を委託し、インバランス料金の精算事務などを代行してもらうことが可能である","代表契約者が全需要家に小売供給を行うこととなる","バランシンググループ内での電気の卸売・転売は認められない"],"a":1,"e":"複数者名義の託送供給契約により②の要件は満たされ、①自ら小売供給を行うことが満たされていれば、代表契約者への計画値同時同量対応事務の委託や精算事務の代行が可能。各小売電気事業者間で電気の卸売・転売をすることも可能とされる。"},{"c":6,"p":"p.46","q":"小売供給契約における電気料金の算出方法について、問題となるものはどれか。","o":["燃料費調整の算定式を約款に定めること","何らかの明確な算式に基づき日本卸電力取引所の取引価格に連動する形で定めること","「当社が毎月末に請求する額」や「時価」とするなど、算出方法を明確に定めないこと","時間帯別に単価を定めること"],"a":2,"e":"算出方法を明確に定めないことは需要家が料金水準の適切性を判断することを著しく困難にするため問題となる。明確な算式に基づく市場連動型は問題がないと考えられる。"},{"c":6,"p":"p.46","q":"小売供給契約の解除等を著しく制約する契約条項の例として、指針が挙げていないものはどれか。","o":["需要家からの解除等を一切許容しない期間を設定すること","自動更新契約において更新を拒否できる期間を極めて短い期間に設定すること","契約期間を1年間と定めること","解除等に関して不当に高額の違約金等を設定すること"],"a":2,"e":"①解除等を一切許容しない期間の設定、②不当に高額な違約金等の設定、③自動更新の拒否可能期間を極めて短く設定すること等が例示されている。契約期間を定めること自体は問題ではない。"},{"c":6,"p":"p.47","q":"小売供給契約の解除等を著しく制約する行為の例として、指針が挙げているものはどれか。","o":["解除申出を書面で受け付けること","解除手続の方法をホームページに掲載すること","コールセンターに電話しても担当者につながないなど、解除の申出等に速やかに対応しないこと","解除時の違約金額を説明すること"],"a":2,"e":"解除の申出や自動更新拒否の申出に応じないこと（担当者につながないなど速やかに対応しないことを含む）、解除手続や更新拒否手続の方法を明示しないことが例示されている。"},{"c":6,"p":"p.47","q":"低圧分野で需要家が転居する場合の望ましい行為として、指針が挙げているものはどれか。","o":["転居先が解除等申出時点において自己から小売供給を受けることができない場所であるときには、違約金等を負担することなく解除等できるよう措置すること","転居時には契約を自動的に解除すること","転居先での契約継続を義務付けること","転居先がどこであっても違約金等を免除すること"],"a":0,"e":"事業展開地域外への転居では需要家側で対応を取り得ないため、自己から供給を受けられない場所への転居の場合は違約金等の負担なく解除等できるよう措置することが望ましい。"},{"c":6,"p":"p.47","q":"需要家の転居に伴い発生する費用の請求について、正しいものはどれか。","o":["違約金として定額を請求できる","一般送配電事業者が需要家に直接請求する","いかなる費用も請求できない","短期間での託送供給契約の解除等・変更を理由として請求された料金及び工事費の精算金や、解除等に伴う電気用品のリース債務残額の支払義務が発生する場合、合理的な範囲で当該費用相当額を需要家に請求することは妨げられない"],"a":3,"e":"託送供給契約に基づき請求された料金・工事費の精算金やリース債務残額が発生する場合、合理的な範囲での請求は妨げられない。"},{"c":6,"p":"p.47","q":"競合相手を市場から退出させる目的での不当に安い価格での小売供給について、指針の記述として正しいものはどれか。","o":["価格設定は自由であるため問題とならない","小売電気事業者間の公正な競争を阻害するおそれがあり、これにより電気事業の健全な発達に支障が生じる（又は生ずるおそれがある）と認められる場合には問題となる","低圧分野に限り問題となる","独占禁止法上の問題のみが生じる"],"a":1,"e":"公正な競争を阻害するおそれがあり電気事業の健全な発達に支障が生じる（おそれがある）と認められる場合に問題となる。取次業者の行為でも指導・監督が適切でなければ小売電気事業者自身の行為が問題となる。"},{"c":7,"p":"p.48","q":"小売電気事業者の苦情等の処理義務の根拠条文はどれか。","o":["電気事業法第2条の12","電気事業法第2条の15","電気事業法第2条の13","電気事業法第2条の17"],"a":1,"e":"小売供給の業務の方法又は料金その他の供給条件についての需要家（小売供給を受けようとする者を含む）からの苦情及び問合せを適切かつ迅速に処理する義務は電気事業法第2条の15に基づく。"},{"c":7,"p":"p.48","q":"苦情・問合せへの対応体制について、指針が求めている対応はどれか。","o":["事業の休止・廃止や料金その他の供給条件の変更をしようとする場合など、苦情及び問合せが通常よりも増加することが見込まれる場合には、必要に応じて処理体制を見直すこと","問合せ先はホームページに掲載せず、契約書面にのみ記載すること","苦情件数が一定数を超えた場合に限り体制を見直すこと","苦情窓口は電話のみとすること"],"a":0,"e":"増加が見込まれる場合の体制見直しが求められ、これを怠ることは問題となる。連絡先は供給条件の説明時に加えホームページ等でも確認できるようにすることが求められる。"},{"c":7,"p":"p.48","q":"原因が不明な停電が生じた場合の対応として、問題となる行為はどれか。","o":["ブレーカーの操作方法を案内すること","一般送配電事業者のホームページの停電情報を案内すること","電気工事店の連絡先を紹介すること","一般送配電事業者又は配電事業者の連絡先を需要家に伝えないなど、需要家からの問合せに不当に応じないこと"],"a":3,"e":"需要家の相談に一切応じない、一般送配電事業者等の連絡先を伝えないなど不当に応じないことは苦情等の処理義務に反する可能性があり問題となる。"},{"c":7,"p":"p.48","q":"送配電設備の要因で停電していることが明らかな場合の望ましい対応はどれか。","o":["復旧見込みを独自に推定して回答すること","一般送配電事業者又は配電事業者がホームページ等を通じて提供する情報を用いて、小売電気事業者が需要家からの問合せに対応すること","小売電気事業者が現地調査を行うこと","小売電気事業者は対応せず、需要家に一般送配電事業者へ直接連絡するよう伝えるにとどめる"],"a":1,"e":"送配電要因が明らかな停電では、一般送配電事業者等が提供する情報を用いて小売電気事業者が問合せに対応することが望ましい。併せて一般送配電事業者等が停電情報を適時に提供することも望ましい。"},{"c":7,"p":"p.49","q":"原因が不明な停電への適切な対応として、指針が望ましいとしているものはどれか。","o":["一律に一般送配電事業者へ転送すること","需要家自身に設備調査を依頼すること","原因が特定できるまで回答を留保すること","停電の状況に応じてブレーカーの操作方法の案内等の助言を行い、解決しない場合は一般送配電事業者や配電事業者、電気工事店の適切な連絡先を紹介すること"],"a":3,"e":"適切な助言（ブレーカーの操作方法の案内等）を行い、解決しない場合は原因特定のため一般送配電事業者・配電事業者・電気工事店の適切な連絡先を紹介することが望ましい。"},{"c":8,"p":"p.50","q":"小売供給契約の解除等の申出を受けた際の本人確認について、指針が例示している方法はどれか。","o":["供給地点特定番号のみを確認する方法","氏名のみを確認する方法","当該需要家の氏名、住所及び契約者番号のすべてを確認する等の適切な方法","電話番号の下4桁を確認する方法"],"a":2,"e":"氏名、住所及び契約者番号のすべてを確認する等の適切な方法による本人確認が求められ、これを怠り需要家本人の意に沿わない解除等手続を行うことは問題となる。"},{"c":8,"p":"p.50","q":"解除等の申出への対応に関し、問題となる行為はどれか。","o":["本人確認を行うこと","解除日を需要家と調整すること","需要家の意に反した過度な「引き留め営業」や過度な本人確認による「引き延ばし営業」を行い、正当な理由なく速やかに解除等に応じないこと","違約金の金額を説明すること"],"a":2,"e":"正当な理由なく速やかに応じないことは問題となる。需要家から取次業者との契約の解除等の申出を受けた小売電気事業者が、取次業者に連絡する等の対応を速やかに取らないことも含まれる。"},{"c":8,"p":"p.51","q":"特定商取引法上、訪問販売及び電話勧誘販売においてクーリング・オフの適用除外とされている電気の供給の組合せとして正しいものはどれか。","o":["自由料金メニューによる小売供給","高圧・特別高圧の小売供給","セット販売による小売供給","最終保障供給、離島等供給及び特定小売供給（経過措置料金）"],"a":3,"e":"特商法第26条第4項第2号等により最終保障供給、離島等供給及び特定小売供給（経過措置料金）が適用除外とされ、これ以外の小売電気事業者が訪問販売等で消費者と契約した場合はクーリング・オフの対象となる。"},{"c":8,"p":"p.51","q":"クーリング・オフを理由に託送供給契約を解除等する場合の小売電気事業者の対応として必要なものはどれか。","o":["特段の通知を要しない","その旨を一般送配電事業者又は配電事業者に通知した上で解除等をすること","需要家に代わって最終保障供給を申し込むこと","経済産業大臣に届け出ること"],"a":1,"e":"一般送配電事業者又は配電事業者が適切な需要家保護措置をとれるよう、クーリング・オフを理由とする旨を通知した上で解除等をすることが必要であり、これを怠ることは問題となる。"},{"c":8,"p":"p.52","q":"無契約を理由とする供給停止に当たり、一般送配電事業者及び配電事業者が検討した上で行うことが前提とされる需要家への配慮措置の例はどれか。","o":["供給継続の要望があった場合の1アンペアブレーカーの取り付け等の対応や、需要家が在宅医療者、生活保護受給者等であることが確認できた場合の配慮措置","供給停止の1年間猶予","小売電気事業者による代替供給の義務付け","電気料金の免除"],"a":0,"e":"1アンペアブレーカーの取り付け等の対応や、在宅医療者・生活保護受給者等であることが確認できた場合の配慮措置を検討した上で供給停止を行うことが前提とされる。"},{"c":8,"p":"p.52","q":"取戻し営業行為の防止に関し、望ましいとされる体制整備の内容はどれか。","o":["切替え前需要家への一律の再提案","スイッチング情報の営業部門への即時共有","解約受付部門の廃止","スイッチング情報についての社内の情報管理体制の構築、営業活動に関わる役職員への社内教育、問題となる行為等の周知徹底"],"a":3,"e":"スイッチング情報の社内情報管理体制の構築、役職員への社内教育、問題となる行為の周知徹底など、適切な社内管理体制の構築が望ましい。"},{"c":8,"p":"p.52","q":"解除等手続等に関する体制について、望ましいとされるものはどれか。","o":["解除の申出は書面のみで受け付けること","解除の申出は契約者本人の対面手続に限ること","需要家が、電話やインターネット上の自己のホームページ、電子メール等、複数の方法から選択して利用できるようにすること","解除の申出は来店受付に限ること"],"a":2,"e":"解除等手続の円滑化のため、需要家が複数の方法から選択して利用できるようにすることが望ましい。"},{"c":8,"p":"p.53","q":"需要家の責めに帰すべき事由によらず小売電気事業者又は取次業者から解除等する場合に、需要家へ併せて通知すべき内容として指針が挙げていないものはどれか。","o":["小売供給の停止の年月日","契約解約等をする理由","苦情や問合せの連絡先","次に契約すべき小売電気事業者の指定"],"a":3,"e":"通知すべきは①停止年月日、②解約等の理由、③苦情・問合せ連絡先、④無契約となれば供給が止まることや最終保障供給の申込方法（代替供給者があればその連絡先等を説明し速やかなスイッチングを促すことが適当）。"},{"c":8,"p":"p.53〜54","q":"小売電気事業を休廃止しようとする場合の周知に関する記述として正しいものはどれか。","o":["休廃止日の前日から起算して60日前（高圧契約、特別高圧契約及び小売供給の相手が1万件以上の事業については90日前）までに周知する必要がある","休廃止日の前日から起算して30日前までに周知すれば足りる","すべての場合に90日前までの周知が必要である","周知の時期に定めはない"],"a":0,"e":"施行規則第3条の11により原則60日前、高圧契約・特別高圧契約及び供給相手が1万件以上の事業は90日前までの周知が必要。加えて停止年月日、休止の場合はその期間、理由、苦情等の連絡先、最終保障供給の申込方法等の周知も必要。"},{"c":8,"p":"p.54","q":"需要家の責めに帰すべき事由等により小売供給契約を解除等する場合に、予告通知等の措置をとらずに解除等しても問題とならないとされる場合はどれか。","o":["需要家と連絡が取れない場合","需要家が解除に同意しない場合","料金の滞納が3か月以上に及ぶ場合","需要家が小売電気事業者に対し事前に通知等をせずに需要場所から移転し、電気を使用していないことが明らかな場合"],"a":3,"e":"事前通知等なく需要場所から移転し電気を使用していないことが明らかな場合は、所定の措置をとらずに解除等しても問題とならない。"},{"c":8,"p":"p.54","q":"料金未払者の情報を小売電気事業者間で交換する場合の取扱いとして適切なものはどれか。","o":["本人への通知は事後で足りる","情報交換は一切認められない","交換する旨、交換される情報の項目、交換する小売電気事業者の範囲及び情報の管理について責任を有する者の氏名又は名称を、あらかじめ当該料金不払者に通知し、又は本人が容易に知り得る状態に置くこと","交換の事実のみを公表すれば足りる"],"a":2,"e":"交換する旨と情報項目、交換する事業者の範囲、情報管理の責任者の氏名又は名称をあらかじめ通知するか、本人が容易に知り得る状態に置くことが適切とされる。"},{"c":8,"p":"p.55","q":"小売電気事業者が託送料金の未払等により託送供給契約を解除される可能性を認識し、解除を回避できる見込みがないと判断する場合に必要な対応はどれか。","o":["直ちに、必要に応じて一般送配電事業者等と協議のうえ、需要家に供給停止日を明示して託送供給契約の解除により電気の供給が停止されるおそれがある旨を通知すること","一般送配電事業者に需要家への通知を委ねること","経済産業大臣への報告のみを行うこと","解除通知を受けてから需要家に連絡すること"],"a":0,"e":"直ちに通知することが必要で、その際に他の小売電気事業者と契約するか最終保障供給を申し込む方法があることを説明する必要がある。"},{"c":8,"p":"p.56","q":"一般送配電事業者又は配電事業者が小売電気事業者の託送料金未払等を理由に託送供給契約を解除する場合、需要家への予告通知の時期として正しいものはどれか。","o":["供給停止の10日程度前及び3日程度前","供給停止の30日程度前までの1回","供給停止の1月程度前及び5日程度前までの各々の時期","供給停止の5日程度前までの1回"],"a":2,"e":"1月程度前と5日程度前の各々の時期に、供給停止日を明示して予告通知を行うことが必要。併せて他の小売電気事業者との契約締結又は最終保障供給の申込方法の説明も必要。"},{"c":8,"p":"p.57","q":"災害時連携の観点から、小売電気事業者の望ましい行為として指針が挙げているものはどれか。","o":["災害時に供給契約を一時停止すること","停電情報を独自に収集し公表すること","被災地域の需要家の電気料金を免除すること","一般送配電事業者等から停電復旧が長期化するエリアの地方自治体の要望に基づく要請を受けた場合に、ポータブル発電機、電動車等を余力の範囲内で当該地方自治体へ貸し出すこと"],"a":3,"e":"停電復旧が長期化するエリアの地方自治体からの要望に基づく要請を受けた場合、ポータブル発電機・電動車等を保有する小売電気事業者が余力の範囲内で貸出し等を行うことが望ましい行為として位置づけられている。"},{"c":9,"p":"p.58","q":"小売電気事業者等が供給条件の説明義務に違反した場合の効果として正しいものはどれか。","o":["直ちに300万円以下の罰金が科される","業務改善命令等が発動され得る（法第2条の17第2項）。業務改善命令に違反した場合は300万円以下の罰金の対象となり得る","直ちに登録が取り消される","行政指導のみが行われる"],"a":1,"e":"説明義務違反は業務改善命令等の対象となり得る。命令違反は300万円以下の罰金（法第118条第1号）で、公共の利益を阻害すると認められるときは登録の取消事由（法第2条の9第1項第1号）となる。"},{"c":9,"p":"p.58","q":"供給条件の「説明」の程度に関する記述として正しいものはどれか。","o":["需要家が理解したことを示す署名を得なければならない","説明すべき事項の情報を需要家が入手できる状態とすれば足りる","需要家が当該事項に関する情報を一通り聴きあるいは読むなどして、その事項について当該需要家の理解の形成を図ることが必要である","需要家に情報を伝達すれば足りる"],"a":2,"e":"情報を入手できる状態とする、あるいは伝達するだけでは不十分で、需要家の理解の形成を図ることが必要とされる。"},{"c":9,"p":"p.59","q":"供給条件の説明方法に関する記述として正しいものはどれか。","o":["書面の郵送による方法は認められない","口頭又は電話による説明に限られる","対面での説明が原則として義務付けられている","インターネット上のウェブサイトで説明事項を閲覧させるオンライン・サインアップや、ダイレクトメール・パンフレットに説明事項を記載して読ませた上で申込みを受け付ける方法によっても、適切な対応を取ることにより説明義務を果たすことは可能である"],"a":3,"e":"分かりやすい記載や需要家が理解したことの確認など適切な対応を取ることにより、オンライン・サインアップやDM・パンフレットによる方法でも説明義務を果たすことは可能とされる。"},{"c":9,"p":"p.59","q":"施行規則第3条の12第1項が定める説明事項のうち、媒介・取次・代理業者が媒介等を行う場合に説明すべき事項として正しいものはどれか。","o":["媒介・取次・代理業者の取扱実績","媒介・取次・代理業者の資本金額","媒介等を行う旨と当該媒介・取次・代理業者の氏名又は名称（第2号）","媒介手数料の額"],"a":2,"e":"第1号（小売電気事業者の氏名又は名称及び登録番号）、第2号（媒介等を行う旨と媒介等業者の氏名又は名称）、第3号（小売電気事業者の苦情・問合せ連絡先と対応時間帯）、第4号（媒介等業者の連絡先等）が基礎的情報として求められる。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第8号として説明すべき事項はどれか。","o":["小売供給開始の予定年月日","契約電力や契約電流の値又は決定方法","燃料又は電力の取引価格の変動により小売供給に係る料金が変動する場合には、その旨並びに変動の額の算出方法及び上限の有無","供給電圧及び周波数"],"a":2,"e":"第6号＝供給開始予定年月日、第7号＝料金（算定方法を含む）、第8号＝価格変動により料金が変動する場合のその旨・変動額の算出方法・上限の有無、第12号＝契約電力等、第13号＝供給電圧及び周波数。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第9号（電気計器その他の用品及び配線工事その他の工事に関する費用の負担に関する事項）の説明内容として、指針が例示しているものはどれか。","o":["工事の施工業者名","電気計器の製造メーカー","需要家の費用負担が生じるのか否か（当該費用負担が小売供給に係る料金に含まれる場合はその旨の明示を含む）及び当該費用負担の算定方法","工事の着工予定日"],"a":2,"e":"費用負担の有無（料金に含まれる場合はその旨の明示を含む）と算定方法などが考えられるとされている。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第11号に関する記述として正しいものはどれか。","o":["期間限定の割引キャンペーンは説明不要である","期間限定でない割引も第11号で説明する","期間を限定して料金等を減免する場合にはその内容を説明する必要があり、期間限定でない特定の需要家に対する割引等は第7号の料金の説明として行う必要がある","割引の内容は契約締結後に説明すれば足りる"],"a":2,"e":"第11号は期間限定の減免の内容。期間限定でない特定需要家への割引等がある場合は第7号の料金の説明として行う必要がある。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第14号（供給電力及び供給電力量の計測方法並びに料金調定の方法）の内容として、指針が例示しているものはどれか。","o":["計量器の検定有効期間","検針日、料金の算定期間・算定方法、使用電力量の計量方法及び日割計算に関する規定を設けること","需給調整契約の内容","力率測定の方法"],"a":1,"e":"検針日、料金の算定期間・算定方法、使用電力量の計量方法及び日割計算に関する規定を設けること等が考えられるとされている。"},{"c":9,"p":"p.60","q":"施行規則第3条の12第1項第16号（託送供給等約款に定められた需要家の責任に関する事項）について、指針が想定している内容はどれか。","o":["需要家が自ら計量値を報告すること","需要家が託送料金を直接負担すること","需要家が保安規程を届け出ること","小売供給に必要な工事を行うため関係事業者が需要家の敷地内などに立ち入ることがあり、その立入りを許可するなど需要家の協力が必要であること等"],"a":3,"e":"立入りの許可等の協力のほか、託送供給等に伴う需要家の協力、保安等や調査に対する協力に関する規定の概要を分かりやすく記載することが必要とされる。"},{"c":9,"p":"p.61","q":"施行規則第3条の12第1項第18号（契約の更新に関する事項）について、指針が例示している内容はどれか。","o":["更新時に再度全項目を説明する旨を定めること","小売電気事業者又は取次業者からの申出により自動更新の拒否を行うことがある場合には、その旨及びその際の手続に関する規定を設けること","更新後の料金水準の見通しを示すこと","更新拒否は需要家からのみ行える旨を定めること"],"a":1,"e":"自動更新に関する規定など契約の更新に関する事項として、事業者側から自動更新の拒否を行うことがある場合はその旨及び手続に関する規定を設けることが考えられるとされている。"},{"c":9,"p":"p.61","q":"既に締結されている小売供給契約を更新する場合（料金ほか契約条件を一切変更せず期間の延長のみをする場合）の説明事項として正しいものはどれか。","o":["説明は一切不要である","料金及び契約期間を説明すれば足りる","すべての事項を再度説明する必要がある","更新後の契約期間のみを説明すれば足りる"],"a":3,"e":"施行規則第3条の12第3項により更新後の契約期間のみの説明で足りる。ただし需要家が一部省略について承諾しない場合は全事項の説明が必要（同項ただし書）。"},{"c":9,"p":"p.61〜62","q":"軽微な変更以外の契約の変更をしようとする場合の説明事項として正しいものはどれか。","o":["変更しようとする事項に加え料金の全体を説明する必要がある","説明は不要である","すべての説明事項を再度説明する必要がある","変更しようとする事項のみを説明すれば足りる"],"a":3,"e":"施行規則第3条の12第4項により変更しようとする事項のみの説明で足りる。例えばコールセンターの外部委託により連絡先が変わる場合は当該電話番号の説明で足りる。"},{"c":9,"p":"p.62","q":"料金の値上げなど供給条件の変更を説明する方法として、十分な説明がなされたとはいえないと解される例はどれか。","o":["対面で変更内容を説明する方法","検針票や請求書の裏面にJIS Z8305に規定する8ポイント未満の小さな文字で変更しようとする事項を記載するだけの方法","変更内容を記載したうえで詳細を掲載したホームページへのリンクを併記する方法","変更内容を記載した書面を郵送する方法"],"a":1,"e":"8ポイント未満の小さな文字で裏面に記載するだけの方法や、変更事項の具体的内容に一切触れずリンクのみを掲載する方法は不十分。変更事項を簡潔に記載しリンクを掲載しても、リンク先に具体的説明の記載や資料の掲載がない場合も不十分と解される。"},{"c":9,"p":"p.62","q":"契約の「軽微な変更」に関する記述として正しいものはどれか。","o":["軽微な変更は引用条項が複数ある場合、その一つ一つについて説明が必要である","軽微な変更の場合は説明自体が不要である","軽微な変更でも全事項の説明が必要である","法令の制定又は改廃に伴い当然必要とされる形式的な変更その他実質的な変更を伴わない変更をいい、変更しようとする事項の概要について説明を行えば足りる"],"a":3,"e":"引用する条文の条ずれのように実質的変更を伴わないものが想定され、概要の説明で足りる。複数箇所の引用がある場合も一つ一つの説明は要しない。"},{"c":9,"p":"p.62","q":"契約の更新・変更に伴う説明事項の一部省略について、省略が認められない場合はどれか。","o":["小売供給を受けようとする者が説明事項を一部省略することについて承諾しない場合","低圧需要家の場合","電話による説明の場合","変更事項が複数にわたる場合"],"a":0,"e":"施行規則第3条の12第3項〜第5項の各ただし書により、需要家が一部省略を承諾しない場合は説明すべき事項の全てを説明する必要がある。"},{"c":9,"p":"p.64","q":"電話により供給条件の説明を行う場合の契約締結前交付書面の取扱いとして正しいものはどれか。","o":["需要家が承諾した場合には説明時に交付することを要しないが、電話での説明を行った後遅滞なく契約締結前交付書面を交付しなければならない","需要家の承諾があれば書面交付は一切不要となる","電話説明では書面交付義務の例外は認められない","電話説明の前に必ず郵送しなければならない"],"a":0,"e":"施行規則第3条の12第7項第1号により説明時の交付は要しないが、同条第8項により電話説明後遅滞なく交付しなければならない。説明内容が多岐にわたることへの配慮による。"},{"c":9,"p":"p.65","q":"契約締結前交付書面に代わる電磁的方法について需要家の承諾を得る方法として正しいものはどれか。","o":["あらかじめ用いる電磁的方法の種類及び内容（ファイルへの記録の方式）を示し、需要家から書面又は電磁的方法による承諾を得ることが必要である","黙示の承諾でも足りる","口頭での承諾を録音すれば足りる","申込書に電磁的方法による旨を記載すれば承諾があったものとみなされる"],"a":0,"e":"電気事業法施行令第2条第1項等により、電磁的方法の種類及び内容を示し書面又は電磁的方法による承諾を得ることが必要。電話における口頭承諾の録音は認められない。承諾後に提供を受けない旨の申出があれば電磁的方法による提供はできない。"},{"c":9,"p":"p.66","q":"ホームページ等での閲覧により契約締結前交付書面に代える場合の取扱いとして正しいものはどれか。","o":["需要家が説明事項を出力して書面を作成することができない場合には、当該ホームページ等に表示した説明事項について3ヶ月間は消去・改変できないようにしなければならない","表示期間の定めはない","1年間の保存が必要である","出力の可否にかかわらず保存は不要である"],"a":0,"e":"施行規則第3条の12第14項第2号関係。加えて、リンク先表示の文字列をページ最後に置く、理解した旨のチェック項目を設ける等の工夫が望ましいとされる。"},{"c":9,"p":"p.66","q":"電磁的方法により説明事項を提供した場合の書面交付について正しいものはどれか。","o":["要請があっても交付する必要はない","要請の有無にかかわらず必ず交付しなければならない","需要家から書面で交付して欲しい旨の要請があった場合には、契約締結前交付書面を交付するよう努める必要がある","要請は書面によるものに限られる"],"a":2,"e":"施行規則第3条の12第15項により、需要家から書面交付の要請があった場合は交付するよう努める必要がある（努力義務）。"},{"c":9,"p":"p.67","q":"契約締結後交付書面に固有の記載事項として正しいものはどれか。","o":["小売電気事業者の資本金","媒介・取次・代理業者の登録番号","小売供給契約の申込みの方法","供給地点特定番号"],"a":3,"e":"停電時の復旧対応を迅速に行うためなどに必要な供給地点特定番号の記載が必要。一方、施行規則第3条の12第1項第5号の「申込みの方法」は契約締結時には不要であるため対象外となる。"},{"c":9,"p":"p.67","q":"媒介業者における契約締結後交付書面の交付時期として正しいものはどれか。","o":["契約を締結したとき","需要家から請求があったとき","供給開始日","媒介により契約が成立したとき"],"a":3,"e":"媒介業者は契約の締結を行う主体ではないため、「契約を締結したとき」ではなく「媒介により契約が成立したとき」に交付が必要となる。"},{"c":9,"p":"p.67","q":"契約締結後交付書面に関する罰則等について正しいものはどれか。","o":["罰則の定めはない","書面を交付しない場合や虚偽の記載・表示をした場合は30万円以下の罰金の対象となり得る","書面を交付しない場合は直ちに登録が取り消される","虚偽記載のみ300万円以下の罰金の対象となる"],"a":1,"e":"法第2条の14第1項違反（不交付・虚偽記載等）は法第120条第2号により30万円以下の罰金。業務改善命令違反は法第118条第1号により300万円以下の罰金の対象となり得る。"},{"c":9,"p":"p.68","q":"既に締結している契約を更新した場合（期間の延長のみ）の契約締結後交付書面の記載事項として正しいものはどれか。","o":["契約年月日と料金の記載が必要である","小売電気事業者の氏名又は名称及び住所、契約年月日、更新後の新たな契約期間及び供給地点特定番号でよい","すべての事項の記載が必要である","記載事項の省略は認められない"],"a":1,"e":"施行規則第3条の13第3項による。ただし需要家が承諾していない場合は記載事項の一部省略は認められない（同項ただし書）。軽微な変更以外の変更の場合は、氏名・住所・契約年月日のほか変更した事項及び供給地点特定番号でよい（同条第4項）。"},{"c":10,"p":"p.71","q":"参考事例の「完全定額料金プラン」に関する記述として正しいものはどれか。","o":["燃料費調整に上限を設けるメニューである","使用電力量が減少した場合には自動的に値下げされる","契約期間内において従量料金が存在せず固定料金のみ存在するメニューで、需要家は燃料費・市場価格の変動リスクや使用量増リスクから遮断される","基本料金のみ固定で従量料金は市場連動となる"],"a":2,"e":"完全定額料金プランでは、燃料費・市場価格の変動リスクと需要家の使用量増リスクを事業者が全て負うため、一定のプレミアムが料金に乗る可能性がある。使用量減少時も値下げはない。"},{"c":10,"p":"p.71","q":"「基本料金・従量料金単価が固定されたプラン」における事業者側の主なリスク・コストとして、指針が挙げているものはどれか。","o":["燃料費・市場価格の変動リスクや需要家の使用量増のコストを全て負うこととなるため、それらをヘッジするための対策が必要となる","需要家からの解約が増加する","燃料費下落局面で収入が低下する","調整上限を毎年見直す必要がある"],"a":0,"e":"事業者が変動リスクを全て負うためヘッジ対策が必要。一方で燃料費・市場価格の下落局面でも収入は低下しないというメリットがある。"},{"c":10,"p":"p.72","q":"「調整上限設定プラン」において、事後払いの仕組みがない場合の事業者側のリスクとして正しいものはどれか。","o":["需要家が変動リスクを全て負う","調整が需要家に不利に働く","燃料費・市場価格の高騰時には調整上限超過分を事業者が負担することになる","調整上限を超えた分を需要家に遡って請求できる"],"a":2,"e":"調整上限超過分は事後払いの仕組みとすることもあり得るが、事後払いの仕組みがない場合は高騰時の超過分を事業者が負担することになる。"},{"c":10,"p":"p.72","q":"「非調整バンド設定プラン」の仕組みとして正しいものはどれか。","o":["燃料費調整の上限のみを設定する手法である","市場価格連動項を設けない手法である","燃料費調整や市場価格連動項において、料金単価の調整を実施しない一定の変動幅を設定する手法である","一定期間調整を停止する手法である"],"a":2,"e":"変動幅が非調整バンド内であれば需要家は変動リスクから遮断されるが下落局面でも値下げはない。バンドを超える場合は需要家が変動リスクを負い、事業者は変動リスクを軽減できる。"},{"c":10,"p":"p.73","q":"「連動プラン」（燃料費調整と市場価格連動項に上限設定や非調整バンドの設定を行わない手法）について、指針が事業者側の主なリスク・コスト欄に記載している内容はどれか。","o":["調整上限超過分の負担","収入が変動しないこと","非調整バンドの見直しが必要となること","他の料金メニューに比しても、より丁寧な需要家への説明が期待されること"],"a":3,"e":"連動プランは需要家が背負う変動リスクが大きい一方、事業者は変動リスクを軽減できる。その分、他のメニューに比してもより丁寧な需要家への説明が期待される。"}]};
const QS = DATA.questions, CHS = DATA.chapters;
const $ = id => document.getElementById(id);
const chName = c => (CHS.find(x => x.id === c) || {}).name || "";

let quiz = [], idx = 0, answered = false, hits = 0, log = [];

/* ---------- 設定画面 ---------- */
function buildChapters(){
  $("totalq").textContent = QS.length;
  $("chapters").innerHTML = CHS.map(ch => {
    const n = QS.filter(q => q.c === ch.id).length;
    return '<label><input type="checkbox" class="chk" value="' + ch.id + '" checked>' +
           '<span class="ch-name">' + ch.id + '. ' + ch.name + '</span>' +
           '<span class="ch-meta">' + ch.range + '／' + n + '問</span></label>';
  }).join("");
  document.querySelectorAll(".chk").forEach(c => c.addEventListener("change", updatePool));
  updatePool();
}
const picked = () => Array.from(document.querySelectorAll(".chk:checked")).map(c => +c.value);
function pool(){ const p = picked(); return QS.filter(q => p.includes(q.c)); }
function updatePool(){
  const n = pool().length;
  $("poolinfo").textContent = n ? "選択中の範囲：" + n + "問" : "章を1つ以上選んでください。";
  $("start").disabled = n === 0;
}
$("selAll").onclick = () => { document.querySelectorAll(".chk").forEach(c => c.checked = true); updatePool(); };
$("selNone").onclick = () => { document.querySelectorAll(".chk").forEach(c => c.checked = false); updatePool(); };

/* ---------- 出題 ---------- */
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQuiz(list){
  quiz = list; idx = 0; hits = 0; log = [];
  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("qtotal").textContent = quiz.length;
  render();
  window.scrollTo(0, 0);
}
$("start").onclick = () => {
  let list = pool().slice();
  if($("order").value === "random") shuffle(list); else list.sort((a, b) => QS.indexOf(a) - QS.indexOf(b));
  const n = +$("numq").value;
  if(n > 0) list = list.slice(0, n);
  startQuiz(list);
};
$("quit").onclick = () => {
  $("quiz").classList.add("hidden");
  $("setup").classList.remove("hidden");
  window.scrollTo(0, 0);
};

function render(){
  answered = false;
  const q = quiz[idx];
  $("qnum").textContent = idx + 1;
  $("hit").textContent = hits;
  $("prog").style.width = (idx / quiz.length * 100) + "%";
  $("tagchap").textContent = "第" + q.c + "章　" + chName(q.c);
  $("tagpage").textContent = "指針 " + q.p;
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.o.map((t, i) =>
    '<button class="opt" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + esc(t) + '</span></button>'
  ).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("verdict").innerHTML = "";
  $("qactions").innerHTML = "";
}
function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function answer(i){
  if(answered) return;
  answered = true;
  const q = quiz[idx], ok = i === q.a;
  if(ok) hits++;
  log.push({ q: q, picked: i, ok: ok });
  $("hit").textContent = hits;
  document.querySelectorAll(".opt").forEach(b => {
    const bi = +b.dataset.i;
    b.disabled = true;
    if(bi === q.a) b.classList.add("correct");
    else if(bi === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  $("verdict").innerHTML =
    '<div class="verdict ' + (ok ? "ok" : "ng") + '"><h3>' + (ok ? "正解" : "不正解") + '</h3>' +
    '<p>' + esc(q.e) + '</p><span class="src">指針 ' + q.p + '　第' + q.c + '章 ' + chName(q.c) + '</span></div>';
  const last = idx === quiz.length - 1;
  $("qactions").innerHTML = '<button class="btn" id="next">' + (last ? "結果を見る" : "次の問題へ") + '</button>';
  $("next").onclick = next;
  $("next").focus();
}
function next(){
  if(idx === quiz.length - 1){ finish(); return; }
  idx++; render();
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", e => {
  if($("quiz").classList.contains("hidden")) return;
  if(!answered && ["1", "2", "3", "4"].includes(e.key)) answer(+e.key - 1);
  else if(answered && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); next(); }
});

/* ---------- 結果 ---------- */
function finish(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const pct = Math.round(hits / quiz.length * 100);
  $("rnum").textContent = hits;
  $("rden").textContent = quiz.length;
  $("rpct").textContent = "正答率 " + pct + "%";
  $("rjudge").textContent =
    pct >= 90 ? "指針の細部まで正確に押さえられています。" :
    pct >= 70 ? "大枠は理解できています。取りこぼした条項を該当ページで確認しましょう。" :
    pct >= 50 ? "要件や日数の取り違えが目立ちます。間違えた章を通読し直すことをおすすめします。" :
                "該当ページを参照しながら、章を絞って解き直しましょう。";

  const stats = {};
  log.forEach(r => { const c = r.q.c; stats[c] = stats[c] || { n: 0, h: 0 }; stats[c].n++; if(r.ok) stats[c].h++; });
  $("bychap").innerHTML = Object.keys(stats).sort((a, b) => a - b).map(c => {
    const s = stats[c], p = Math.round(s.h / s.n * 100);
    return '<div><span class="n">第' + c + '章 ' + chName(+c) + '</span>' +
           '<span class="g"><i style="width:' + p + '%"></i></span>' +
           '<span class="s">' + s.h + '/' + s.n + '</span></div>';
  }).join("");

  const wrong = log.filter(r => !r.ok);
  if(wrong.length === 0){
    $("reviewPanel").classList.add("hidden");
  } else {
    $("reviewPanel").classList.remove("hidden");
    $("review").innerHTML = wrong.map(r =>
      '<details><summary>' + esc(r.q.q) + '</summary><div class="body">' +
      '<p class="ans">正解：<b>' + esc(r.q.o[r.q.a]) + '</b></p>' +
      '<p class="ans yours">あなたの解答：' + esc(r.q.o[r.picked]) + '</p>' +
      '<p>' + esc(r.q.e) + '</p>' +
      '<span class="src">指針 ' + r.q.p + '　第' + r.q.c + '章 ' + chName(r.q.c) + '</span></div></details>'
    ).join("");
  }
  $("retryWrong").style.display = wrong.length ? "" : "none";
  $("retryWrong").onclick = () => startQuiz(shuffle(wrong.map(r => r.q)));
  window.scrollTo(0, 0);
}
$("again").onclick = () => {
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
  window.scrollTo(0, 0);
};

buildChapters();
</script>
</body>
</html>
